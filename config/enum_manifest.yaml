# Hand-written manual bindings (CONVENTIONS.md §12).
#
# One of the two sources folded into cdm/enums.yaml; the other is
# build/fhir_enums.yaml, expanded from the FHIR packages. A manual binding
# overrides the FHIR default for the same field, and only entries a resource
# config names by `binding:` are emitted.
#
# This file holds hand-written bindings and nothing else. An entry that merely
# reproduces its FHIR value set is redundant - generate_linkml.py reports those
# on each run.
#
# Run:  uv run scripts/generate_linkml.py
#
# Requires FHIR packages to be installed first:
#   npm install
#
# source types:
#   codesystem  – concepts extracted from a FHIR CodeSystem in node_modules/
#                 identified by canonical url + npm package name
#   manual      – values defined inline below (stable FHIR R4 / CDM-defined)
#
# `local_codes: true` marks an entry whose codes come from outside FHIR
# entirely - a local vocabulary that REPLACES the field's binding rather than
# copying, subsetting or unioning it. Almost every entry here leaves it off,
# because almost every entry still describes the value set its field binds:
#
#   EncounterClassEnum    v3-ActEncounterCode, verbatim
#   MedicationRouteEnum   a subset of the SNOMED routes UK Core binds
#   ConditionCategoryEnum a union across two FHIR code systems
#   EthnicCategoryEnum    the CodeSystem underlying the bound value set
#
# EncounterCategoryEnum is the exception: `apc_spell` and `ecds_attendance`
# appear in no FHIR value set at all.
#
# With the flag set, the generator emits the bound URL as `replaces_value_set`
# rather than `value_set`, and `binding_source: local` rather than `manual`, so
# the schema does not claim conformance to a vocabulary the column does not
# use. `binding_strength` is still emitted, because it is what says whether the
# replacement is legitimate: FHIR's `preferred` explicitly permits an instance
# to use codes from elsewhere, while `required` does not - a local vocabulary
# replacing a `required` binding produces non-conformant FHIR.
#
# The flag is a claim the generator checks: an entry that sets it but whose
# codes reproduce the bound value set anyway is reported on each run.

enums:
  # ---------------------------------------------------------------------------
  # Patient
  # ---------------------------------------------------------------------------

  EthnicCategoryEnum:
    description: "NHS England ethnic category codes (UKCore-EthnicCategoryEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-EthnicCategoryEngland
    package: fhir.r4.ukcore.stu2

  # ---------------------------------------------------------------------------
  # Encounter
  # ---------------------------------------------------------------------------

  EncounterCategoryEnum:
    description: >-
      CDM-defined encounter category. Primary analyst axis; not a FHIR
      element. These codes are the CDM's own and appear in no FHIR value set.
      Encounter.type is bound `preferred` to
      https://fhir.hl7.org.uk/ValueSet/UKCore-EncounterType, a SNOMED CT
      descendant filter (185316007, 308467007, 185201007) with no overlap
      here; this axis replaces that binding rather than narrowing it.
    source: manual
    local_codes: true
    values:
      - { code: apc_spell, display: "APC spell (admission to discharge)" }
      - {
          code: apc_episode,
          display: "APC consultant episode (within a spell)",
        }
      - { code: ecds_attendance, display: "Emergency Care Data Set attendance" }
      - { code: opd_attendance, display: "Outpatient attendance" }
      - { code: gp_encounter, display: "GP/primary care encounter" }
      - { code: ward_stay, display: "Ward movement / bed-day record" }
      - { code: icu_stay, display: "ICU/HDU stay" }

  EncounterClassEnum:
    description: "v3 ActEncounterCode - encounter class."
    source: manual
    values:
      - { code: AMB, display: "ambulatory" }
      - { code: EMER, display: "emergency" }
      - { code: FLD, display: "field" }
      - { code: HH, display: "home health" }
      - { code: IMP, display: "inpatient encounter" }
      - { code: ACUTE, display: "inpatient acute" }
      - { code: NONAC, display: "inpatient non-acute" }
      - { code: OBSENC, display: "observation encounter" }
      - { code: PRENC, display: "pre-admission" }
      - { code: SS, display: "short stay" }
      - { code: VR, display: "virtual" }

  AdmissionMethodEnum:
    description: "NHS England admission method codes (UKCore-AdmissionMethodEngland)."
