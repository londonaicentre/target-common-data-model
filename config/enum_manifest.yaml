# Hand-written manual bindings (CONVENTIONS.md §12).
#
# One of the two sources folded into cdm/enums.yaml; the other is
# build/fhir_enums.yaml, expanded from the FHIR packages. A manual binding
# overrides the FHIR default for the same field, and only entries a resource
# config names by `binding:` are emitted.
#
# This file holds hand-written bindings and nothing else. An entry that merely
# reproduces its FHIR value set is redundant - generate_linkml.py reports those
# on each run.
#
# Run:  uv run scripts/generate_linkml.py
#
# Requires FHIR packages to be installed first:
#   npm install
#
# source types:
#   codesystem  – concepts extracted from a FHIR CodeSystem in node_modules/
#                 identified by canonical url + npm package name
#   manual      – values defined inline below (stable FHIR R4 / CDM-defined)

enums:
  # ---------------------------------------------------------------------------
  # Patient
  # ---------------------------------------------------------------------------

  EthnicCategoryEnum:
    description: "NHS England ethnic category codes (UKCore-EthnicCategoryEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-EthnicCategoryEngland
    package: fhir.r4.ukcore.stu2

  MaritalStatusEnum:
    description: "NHS England person marital status codes (UKCore-PersonMaritalStatusEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-PersonMaritalStatusEngland
    package: fhir.r4.ukcore.stu2

  # ---------------------------------------------------------------------------
  # Encounter
  # ---------------------------------------------------------------------------

  EncounterCategoryEnum:
    description: "CDM-defined encounter category. Primary analyst axis; not a FHIR element."
    source: manual
    values:
      - { code: apc_spell, display: "APC spell (admission to discharge)" }
      - {
          code: apc_episode,
          display: "APC consultant episode (within a spell)",
        }
      - { code: ecds_attendance, display: "Emergency Care Data Set attendance" }
      - { code: opd_attendance, display: "Outpatient attendance" }
      - { code: gp_encounter, display: "GP/primary care encounter" }
      - { code: ward_stay, display: "Ward movement / bed-day record" }
      - { code: icu_stay, display: "ICU/HDU stay" }

  EncounterClassEnum:
    description: "v3 ActEncounterCode - encounter class."
    source: manual
    values:
