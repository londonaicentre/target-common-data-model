  # ---------------------------------------------------------------------------
  # Condition
  # ---------------------------------------------------------------------------

  ConditionCategoryEnum:
    description: >-
      Condition category. A UNION across two code systems, which is why it
      cannot be derived: `problem-list-item` and `encounter-diagnosis` come
      from http://terminology.hl7.org/CodeSystem/condition-category, and
      `presenting-complaint` and `co-morbidity` from
      https://fhir.hl7.org.uk/CodeSystem/UKCore-ConditionCategory. Codes and
      displays are verbatim from those systems.
    source: manual
    values:
      - { code: problem-list-item, display: "Problem List Item" }
      - { code: encounter-diagnosis, display: "Encounter Diagnosis" }
      - { code: presenting-complaint, display: "Presenting Complaint" }
      - { code: co-morbidity, display: "Co-morbidity" }

  ObservationCategoryEnum:
    description: "Observation category (HL7 FHIR observation-category)."
    source: manual
    values:
      - { code: social-history, display: "Social History" }
      - { code: vital-signs, display: "Vital Signs" }
      - { code: imaging, display: "Imaging" }
      - { code: laboratory, display: "Laboratory" }
      - { code: procedure, display: "Procedure" }
