  OutcomeOfAttendanceEnum:
    description: "NHS England outcome of attendance codes (UKCore-OutcomeOfAttendanceEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-OutcomeOfAttendanceEngland
