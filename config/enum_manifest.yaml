      - { code: "37161004", display: "Rectal" }
      - { code: "16857009", display: "Vaginal" }
      - { code: "37839007", display: "Sublingual" }
      - { code: "54471007", display: "Buccal" }
      - { code: "46713006", display: "Nasal" }
      - { code: "54485002", display: "Ophthalmic route" }
      - { code: "10547007", display: "Otic" }
      - { code: "45890007", display: "Transdermal" }
      - { code: "72607000", display: "Intrathecal" }
      - { code: "404820008", display: "Epidural" }
      - { code: "58100008", display: "Intraarterial" }
      - { code: "12130007", display: "Intraarticular" }
      - { code: "417255000", display: "Intraosseous" }
      - { code: "38239002", display: "Intraperitoneal" }
