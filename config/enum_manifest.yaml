      `default` therefore cannot reach. Codes and displays are SNOMED concept
      IDs taken from that value set; this list is deliberately INCOMPLETE,
      covering the routes seen in hospital EHR prescribing and administration
      data. A conformant record using a route outside this list fails its
      accepted_values test rather than resolving - widen the list when that
      happens.
    source: manual
