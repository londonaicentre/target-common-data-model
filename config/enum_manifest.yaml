  # ---------------------------------------------------------------------------
  # Appointment
  # ---------------------------------------------------------------------------

  AppointmentTypeEnum:
    description: "Appointment type - the v2-0276 general codes plus the UK Core urgent-follow-up supplement. This is the union UKCore-AppointmentReasonCode binds; the value set spans two code systems so it cannot be expanded offline, and UKCore-AppointmentReasonCode alone is a one-code supplement rather than a usable list."
    source: manual
    values:
      - { code: ROUTINE, display: "Routine appointment - default if not valued" }
      - { code: WALKIN, display: "A previously unscheduled walk-in visit" }
      - { code: CHECKUP, display: "A routine check-up, such as an annual physical" }
      - { code: FOLLOWUP, display: "A follow up visit from a previous appointment" }
      - { code: EMERGENCY, display: "Emergency appointment" }
      # From UKCore-AppointmentReasonCode; the other five are v2-0276.
      - { code: urgent-follow-up, display: "Urgent follow-up" }

  AppointmentCancellationReasonEnum:
    description: >-
      Cancellation reason - the axis that separates a patient DNA from a
      provider-side cancellation. A CDM-chosen SUBSET of
      http://terminology.hl7.org/CodeSystem/appointment-cancellation-reason,
      which FHIR binds `example` and which `default` therefore cannot reach.

      Codes and displays are taken VERBATIM from that code system. It is
      marked `content: example` but ships all 32 concepts, so the subset is a
      modelling choice rather than a gap in the packages - the parent codes
      (pat, prov, other) plus the child reasons that UK PAS systems actually
      populate. Deliberately INCOMPLETE: a cancellation using a reason outside
      this list fails its accepted_values test rather than resolving.

      The 21 omitted children are mostly US-centric (oth-cms CMS therapy cap,
      pat-mt member terminated, prov-mri MRI screening form) or too granular
      for a UK feed; widen the list if a source populates them.
    source: manual
    values:
      # --- Patient-side ---------------------------------------------------
      - { code: pat, display: "Patient" }
      - { code: pat-crs, display: "Patient: Canceled via automated reminder system" }
      - { code: pat-cpp, display: "Patient: Canceled via Patient Portal" }
      - { code: pat-dec, display: "Patient: Deceased" }
      - { code: pat-fb, display: "Patient: Feeling Better" }
      - { code: pat-lt, display: "Patient: Lack of Transportation" }
      - { code: pat-mv, display: "Patient: Moved" }
      - { code: pat-ucp, display: "Patient: Unhappy/Changed Provider" }
      # --- Provider-side --------------------------------------------------
      - { code: prov, display: "Provider" }
      - { code: prov-dch, display: "Provider: Discharged" }
      - { code: prov-hosp, display: "Provider: Hospitalized" }
      - { code: prov-pers, display: "Provider: Personal" }
      # --- Service-side ---------------------------------------------------
      - { code: maint, display: "Equipment Maintenance/Repair" }
      - { code: meds-inc, display: "Prep/Med Incomplete" }
      - { code: other, display: "Other" }
      - { code: oth-err, display: "Other: Error" }
      - { code: oth-room, display: "Other: Room/Resource Maintenance" }
      - { code: oth-weath, display: "Other: Weather" }

  # ---------------------------------------------------------------------------
  # DiagnosticReport
  # ---------------------------------------------------------------------------

  DiagnosticServiceSectionEnum:
    description: >-
      Diagnostic service section - the axis separating a microbiology culture
      from a chemistry panel from a radiology report. A CDM-chosen SUBSET of
      HL7 v2-0074
      (http://terminology.hl7.org/CodeSystem/v2-0074), which FHIR binds
      `example` and which `default` therefore cannot reach. Codes and displays
      are taken from that code system; this list is deliberately INCOMPLETE,
      covering the services seen in UK LIMS and RIS feeds. A report using a
      section outside this list fails its accepted_values test rather than
      resolving - widen the list when that happens.

      The imaging modalities in v2-0074 (CT, NMR, NMS, RUS, CUS, OUS, XRC,
      IMG, RX) are collapsed into RAD. Modality is a property of the study
      rather than of the reporting service, and it is carried by
      DiagnosticReport.code; splitting the service axis by modality would
      make a plain radiology report and a CT report look like different
      services when they come from the same department.
    source: manual
    values:
      - { code: CH, display: "Chemistry" }
      - { code: HM, display: "Hematology" }
      - { code: MB, display: "Microbiology" }
      - { code: BLB, display: "Blood Bank" }
      - { code: SR, display: "Serology" }
      - { code: VR, display: "Virology" }
      - { code: MYC, display: "Mycology" }
      - { code: PAR, display: "Parasitology" }
      - { code: IMM, display: "Immunology" }
      - { code: SP, display: "Surgical Pathology" }
      - { code: PAT, display: "Pathology (gross & histopath, not surgical)" }
      - { code: CP, display: "Cytopathology" }
      - { code: GE, display: "Genetics" }
      - { code: RAD, display: "Radiology" }
      - { code: BG, display: "Blood Gases" }
      - { code: URN, display: "Urinalysis" }
      - { code: TX, display: "Toxicology" }
      - { code: OTH, display: "Other" }

  # ---------------------------------------------------------------------------
  # ImagingStudy
  # ---------------------------------------------------------------------------

  ImagingModalityEnum:
    description: >-
      DICOM acquisition modality - the primary analyst axis of an imaging
      study (a CT is not an MRI is not a plain film). FHIR binds
      ImagingStudy.modality and ImagingStudy.series.modality `extensible` to
      DICOM CID 29
      (http://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_CID_29.html),
      which is a DICOM publication rather than a FHIR ValueSet and ships in no
      package, so `default` cannot reach it and the list has to be
      hand-written.

      Codes and displays are DICOM Defined Terms taken VERBATIM from the DCM
      ontology as it ships in hl7.fhir.r4.core
      (CodeSystem-dicom-dcim.json, http://dicom.nema.org/resources/ontology/DCM,
      3156 concepts, content: complete). They are hand-listed rather than
      derived with `source: codesystem` because DCM is a mixed ontology - the
      same code system holds equipment codes (WSD workstation, PRINT server),
      derived-object codes (PR, SEG, KO) and even patient sex codes (F, M, H).
      Only the acquisition modalities belong on this column, and there is no
      subset mechanism on a `codesystem` entry.

      Deliberately INCOMPLETE - a study using a modality outside this list
      fails its accepted_values test rather than resolving; widen the list
      when that happens. Scope is UK NHS acute radiology, cardiology and
      endoscopy. Notable omissions by choice: the ophthalmology cluster (OPT,
      OPV, OPM, OPR, AR, KER, LEN, VA, FA, FS, SRF, OAM) and the legacy
      pre-PACS terms (CD, DD, CF, DF, VF, DS, AS, LP, CS, CP, BI, DG, LS) -
      add the relevant block if you ingest eye services or a historical
      archive.
    source: manual
    values:
      # --- Radiology: plain film and cross-sectional ---------------------
      - { code: CR, display: "Computed Radiography" }
      - { code: DX, display: "Digital Radiography" }
      - { code: RG, display: "Radiographic imaging" }
      - { code: CT, display: "Computed Tomography" }
      - { code: MR, display: "Magnetic Resonance" }
      - { code: MA, display: "Magnetic resonance angiography" }
      - { code: MG, display: "Mammography" }
      - { code: US, display: "Ultrasound" }
      - { code: RF, display: "Radiofluoroscopy" }
      - { code: XA, display: "X-Ray Angiography" }
      - { code: BMD, display: "Bone Mineral Densitometry" }
      # --- Nuclear medicine ---------------------------------------------
      - { code: NM, display: "Nuclear Medicine" }
      - { code: PT, display: "Positron emission tomography" }
      - { code: ST, display: "Single-photon emission computed tomography" }
      # --- Cardiology ----------------------------------------------------
      - { code: EC, display: "Echocardiography" }
      - { code: ECG, display: "Electrocardiography" }
      - { code: IVUS, display: "Intravascular Ultrasound" }
      - { code: HD, display: "Hemodynamic Waveform" }
      - { code: EPS, display: "Cardiac Electrophysiology" }
      # --- Endoscopy, photography and other departments ------------------
      - { code: ES, display: "Endoscopy" }
      - { code: XC, display: "External-camera Photography" }
      - { code: OP, display: "Ophthalmic photography" }
      - { code: OCT, display: "Optical Coherence Tomography" }
      - { code: SM, display: "Slide Microscopy" }
      - { code: RT, display: "Radiation Therapy Device" }
      # --- Dental --------------------------------------------------------
      - { code: IO, display: "Intra-oral Radiography" }
      - { code: PX, display: "Panoramic X-Ray" }
      # --- Non-image objects that still arrive as a study ----------------
      - { code: SR, display: "Structured Report Document" }
      - { code: OT, display: "Other Modality" }

  ImagingLateralityEnum:
    description: >-
      Laterality of the body site a series was acquired from. The complete
      FHIR R4 bodysite-laterality value set (SNOMED CT), which FHIR binds
      `example` and which `default` therefore cannot reach. Taken whole - at
      three codes a subset saves nothing.
    source: manual
    values:
      - { code: "419161000", display: "Unilateral left" }
      - { code: "419465000", display: "Unilateral right" }
      - { code: "51440002", display: "Bilateral" }

  # ---------------------------------------------------------------------------
  # Location
  # ---------------------------------------------------------------------------

  LocationPhysicalTypeEnum:
    description: >-
      Physical form of a location - which level of the partOf hierarchy a row
      sits at (site > building > wing > ward > room > bed). The complete FHIR
      R4 location-physical-type list
      (http://terminology.hl7.org/CodeSystem/location-physical-type), which
      FHIR binds `example` and which `default` therefore cannot reach. Taken
      whole rather than subsetted: at 14 codes a subset saves nothing and
      would make a conformant value fail.
    source: manual
    values:
      - { code: si, display: "Site" }
      - { code: bu, display: "Building" }
      - { code: wi, display: "Wing" }
      - { code: wa, display: "Ward" }
      - { code: lvl, display: "Level" }
      - { code: co, display: "Corridor" }
      - { code: ro, display: "Room" }
      - { code: bd, display: "Bed" }
      - { code: ve, display: "Vehicle" }
      - { code: ho, display: "House" }
      - { code: ca, display: "Cabinet" }
      - { code: rd, display: "Road" }
      - { code: area, display: "Area" }
      - { code: jdn, display: "Jurisdiction" }
