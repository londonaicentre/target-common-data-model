  DischargeMethodEnum:
    description: "NHS England discharge method codes (UKCore-DischargeMethodEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-DischargeMethodEngland
    package: fhir.r4.ukcore.stu2

  DischargeDestinationEnum:
    description: "NHS England discharge destination codes (UKCore-DischargeDestinationEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-DischargeDestinationEngland
