#
# # MedicationStatement
#
# Grain: one row per MedicationStatement resource. Fact table, OMOP
# `drug_exposure` analogue (the asserted half). OMOP folds prescribing,
# dispensing and administration into DRUG_EXPOSURE; this model keeps them
# apart.
#
# Purpose: what a patient says they are taking. One row per asserted
# medication - the admission reconciliation, the GP repeat list - holding
# the drug, the window it covers and when the assertion was made. Weaker
# provenance than MedicationAdministration by construction: somebody said so.
#
# `id` (PK), `meta_source` and `meta_last_updated` are added to every table
# and are not listed below.

resource: MedicationStatement
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-MedicationStatement
package: fhir.r4.ukcore.stu2

include:

  # --- Status -------------------------------------------------------------

  # Scalar code. `not-taken` positively asserts the patient is NOT taking
  # the drug, which is not the same as an absent row.
  # OMOP: no equivalent.
  MedicationStatement.status:
    bindings:
      MedicationStatement.status: default

  # --- What is being taken ------------------------------------------------

  # Variant: [{system, code, display, is_source}] ->
  # medicationcodeableconcept_coding. Source dm+d coding plus
  # standard-vocabulary codings added downstream; `is_source` true on the
  # original.
  #
  # Unbound: `preferred` to a dm+d `=` filter subset, which needs a
  # terminology server. The vocabulary lives in the mapping layer.
  #
  # OMOP: subsumes drug_concept_id / drug_source_value /
  # drug_source_concept_id - all three are rows here. OMOP allows one standard
  # concept; this carries dm+d VMP, VTM and RxNorm at once, without the loss.
  MedicationStatement.medicationCodeableConcept.coding:
    key: [system, code]

  # --- Who and when -------------------------------------------------------

  # Scalar string FK id -> subject_id.
  # OMOP: drug_exposure.person_id.
  MedicationStatement.subject:
    fk: Patient                 # profile allows [Patient, Group]
  # Scalar string FK id -> context_id. FHIR names the encounter `context`
  # here, so the field follows the element name (§4).
  # OMOP: drug_exposure.visit_occurrence_id.
  MedicationStatement.context:
    fk: Encounter               # profile allows [Encounter, EpisodeOfCare]

  # Scalar datetime -> effectivedatetime. When the patient was taking the
  # drug.
  # OMOP: drug_exposure.drug_exposure_start_datetime.
  MedicationStatement.effectiveDateTime:

  # Nested Period: {start, end} -> effectiveperiod. The window over which
  # the drug was taken; a repeat medication has a start and often no end.
  # OMOP: drug_exposure.drug_exposure_start_datetime /
  # drug_exposure_end_datetime.
  MedicationStatement.effectivePeriod:

  # Scalar datetime -> dateasserted. When the assertion was recorded, as
  # distinct from when the drug was taken.
  # OMOP: no equivalent.
  MedicationStatement.dateAsserted:

  # --- Dosage -------------------------------------------------------------

  # Variant: [{sequence, text, route{coding[]}}] -> dosage. How the patient
  # reports taking the drug. `text` is the human-readable dose; `sequence`
  # orders multi-step regimens, so a first entry would take one step of a
  # taper.
  # OMOP: drug_exposure.sig / route_concept_id.
  MedicationStatement.dosage:
    key: [sequence, text]
    bindings:
      # Manual: CDM subset of the SNOMED route hierarchy FHIR binds
      # `preferred`, which needs a terminology server.
      MedicationStatement.dosage.route.coding.code: MedicationRouteEnum
    exclude:
      MedicationStatement.dosage.additionalInstruction: >
        limited analytical utility; supplementary advice text rather than dose
      MedicationStatement.dosage.patientInstruction: >
        limited analytical utility; duplicates `text` without adding
        analysable content
      MedicationStatement.dosage.timing: >
        not in scope of typical source data; Timing is a deep recursive
        structure that would nest arrays inside the variant
      MedicationStatement.dosage.asNeededBoolean: >
        not in scope of typical source data
      MedicationStatement.dosage.asNeededCodeableConcept: >
        not in scope of typical source data
      MedicationStatement.dosage.site: >
        limited analytical utility; route carries the analytical signal
      MedicationStatement.dosage.method: >
        limited analytical utility; route carries the analytical signal
      MedicationStatement.dosage.doseAndRate: >
        not in scope of typical source data; an array of choice-typed
        Quantities nested inside a variant, and the dose text is what these
        feeds populate
      MedicationStatement.dosage.maxDosePerPeriod: >
        not in scope of typical source data; a prescribing safety ceiling
        rather than a drug history fact
      MedicationStatement.dosage.maxDosePerAdministration: >
        not in scope of typical source data
      MedicationStatement.dosage.maxDosePerLifetime: >
        not in scope of typical source data
      MedicationStatement.dosage.route.text: >
        rendered term; the coding carries the meaning

  # --- Variants -----------------------------------------------------------

  # Variant: [{system, value}] -> identifier. Statement id from the source
  # system. The profile makes `system` and `value` 1..1 here, unlike most
  # resources.
  # OMOP: drug_exposure.drug_source_value.
  MedicationStatement.identifier:
    key: [system, value]
    exclude:
      MedicationStatement.identifier.assigner: >
        Organization not modelled; `system` already namespaces the issuer
      MedicationStatement.identifier.period: >
        identifier validity windows are not populated in practice
      MedicationStatement.identifier.type: >
        redundant with `system`
      MedicationStatement.identifier.use: >
        not reliably populated across source systems

  # --- Extension slices ---------------------------------------------------

  # Scalar datetime -> extension_medicationstatementlastissuedate. When the
  # medication was last issued - what separates a live repeat from a stale
  # list entry.
  # OMOP: no equivalent; UK Core specific.
  MedicationStatement.extension:medicationStatementLastIssueDate:

  # --- Free text ----------------------------------------------------------

  # Scalar string -> note_text, promoted from note[0].text. Unstructured and
  # frequently identifying; author and timestamp are not taken.
  # OMOP: no equivalent.
  MedicationStatement.note[0].text:

# ===========================================================================
# Rejected - notable absences and why (§11)
# ===========================================================================
rejected:

  # --- medication[x] ------------------------------------------------------
  MedicationStatement.medicationReference: >
    Medication not modelled, by decision: this CDM takes dm+d inline via
    medicationCodeableConcept. A feed writing the reference form loses the
    drug code - a known and accepted limitation
  MedicationStatement.medicationCodeableConcept.text: >
    NOT whitelisted - `medicationCodeableConcept.coding` is named instead, so
    the rendered drug name is dropped and the dm+d coding carries the meaning

  # --- Provenance of the assertion ----------------------------------------
  MedicationStatement.informationSource: >
    unconstrained pointer across Patient/Practitioner/RelatedPerson; no FK
    target is correct
  MedicationStatement.derivedFrom: >
    limited analytical utility; the provenance chain is a graph, not a column

  # --- Classification -----------------------------------------------------
  MedicationStatement.category: >
    not in scope of typical source data; `extensible` across two code systems
    so `default` cannot resolve it, and the encounter carries the setting
  MedicationStatement.statusReason: >
    not in scope of typical source data; `example` to a SNOMED `is-a` subset
    that needs a terminology server

  # --- References to other resources --------------------------------------
  MedicationStatement.basedOn: >
    limited analytical utility; the prescribing chain is a graph, not a column
  MedicationStatement.partOf: >
    limited analytical utility; nesting within a larger event is a graph, not
    a column
  MedicationStatement.reasonCode: >
    limited analytical utility; the indication is carried by the linked
    Condition
  MedicationStatement.reasonReference: >
    limited analytical utility; the indication is carried by the linked
    Condition

  # --- Extension slices ---------------------------------------------------
  MedicationStatement.extension:pharmacistVerifiedIndicator: >
    limited analytical utility; a workflow flag about the reconciliation
    process rather than about the medication
  MedicationStatement.extension:medicationPrescribingOrganizationType: >
    limited analytical utility; the encounter and managing organisation carry
    the care setting
