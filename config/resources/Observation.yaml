#
# Observation
#
# Grain: one row per Observation resource. Fact table, OMOP `measurement` /
# `observation` analogue.
#
# Purpose: what was measured or observed, and what the answer was. One row
# per result - a lab test, a vital sign, a recorded finding. Of the eleven
# value[x] types this model takes Quantity and CodeableConcept, plus the
# component array for multi-part results.
#
# `id` (PK), `meta_source` and `meta_last_updated` are added to every table
# and are not listed below.

resource: Observation
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-Observation
package: fhir.r4.ukcore.stu2

include:

  # --- Status -------------------------------------------------------------

  # Scalar code.
  # OMOP: no equivalent.
  Observation.status:
    bindings:
      Observation.status: default

  # --- Category -----------------------------------------------------------

  # Nested Coding from category[0].coding[0]: {system, code, display,
  # is_source} -> category_coding. The coarse axis separating a blood test
  # from a vital sign.
  # OMOP: measurement.measurement_type_concept_id /
  # observation.observation_type_concept_id.
  Observation.category.coding[0]:
    bindings:
      # Manual: promotes the FHIR `preferred` observation-category list.
      Observation.category.coding.code: ObservationCategoryEnum

  # --- What was measured --------------------------------------------------

  # Variant: [{system, code, display, is_source}] -> code_coding. Source
  # code plus mapped equivalents added downstream; `is_source` true on the
  # original.
  #
  # Unbound: `preferred` to a SNOMED `is-a` subset, which needs a terminology
  # server. The vocabulary lives in the mapping layer.
  #
  # OMOP: subsumes measurement.measurement_concept_id / measurement_source_value
  # / measurement_source_concept_id (lab and vitals; observation.* otherwise) -
  # the variant holds every mapped vocabulary as rows, not one standard concept.
  Observation.code.coding:
    key: [system, code]

  # --- Who and when -------------------------------------------------------

  # Scalar string FK id -> subject_id.
  # OMOP: measurement.person_id / observation.person_id.
  Observation.subject:
    fk: Patient                 # profile allows [Patient, Group, Device,
                                # Location]
  # Scalar string FK id -> encounter_id.
  # OMOP: measurement.visit_occurrence_id / observation.visit_occurrence_id.
  Observation.encounter:
    fk: Encounter

  # Scalar datetime -> effectivedatetime. When the specimen was taken or the
  # observation made.
  # OMOP: measurement.measurement_datetime / observation.observation_datetime.
  Observation.effectiveDateTime:

  # --- The result ---------------------------------------------------------

  # Nested Quantity: {value, comparator, unit, system, code} ->
  # valuequantity. `unit` is the human string and `code` the UCUM unit; both
  # are kept. `comparator` is load bearing - "<0.5" is not the number 0.5.
  # OMOP: measurement.value_as_number / unit_concept_id / operator_concept_id.
  Observation.valueQuantity:
    bindings:
      Observation.valueQuantity.comparator: default

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> valuecodeableconcept. Coded results - organism identified, blood
  # group, positive/negative.
  # OMOP: measurement.value_as_concept_id / observation.value_as_concept_id.
  Observation.valueCodeableConcept:
    exclude:
      Observation.valueCodeableConcept.text: >
        rendered term; the coding carries the meaning

  # Scalar decimals -> referencerange_low_value, referencerange_high_value,
  # promoted from referenceRange[0]. The lab's own normal range; age and
  # population qualifiers are dropped.
  # OMOP: measurement.range_low / measurement.range_high.
  Observation.referenceRange.low.value:
  Observation.referenceRange.high.value:

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> dataabsentreason. Why a value is missing - separates "not tested"
  # from "result pending" from "specimen unusable".
  # OMOP: no equivalent.
  Observation.dataAbsentReason:
    bindings:
      Observation.dataAbsentReason.coding.code: default
    exclude:
      Observation.dataAbsentReason.text: >
        rendered term; the coding carries the meaning

  # --- Interpretation -----------------------------------------------------

  # Nested Coding from interpretation[0].coding[0]: {system, code, display,
  # is_source} -> interpretation_coding. The lab's own abnormality flag.
  # OMOP: no equivalent, which is why range_low / range_high are kept.
  Observation.interpretation.coding[0]:
    bindings:
      # Manual: CDM subset dropping the v3 abstract parents no result is
      # ever coded with.
      Observation.interpretation.coding.code: ObservationInterpretationEnum

  # --- Variants -----------------------------------------------------------

  # Variant: [{code{coding[]}, valuequantity{...}, valuecodeableconcept
  # {coding[]}}] -> component. Multi-part results - systolic and diastolic
  # are two components of one blood pressure, and a first entry would leave
  # a BP reading with one number and no way to tell which.
  #
  # `key` names fields of the object (§9), so it is the CodeableConcept
  # itself - no path beneath a variant can promote a scalar out of it.
  # OMOP: needs one measurement row per component, linked by
  # measurement_event_id / meas_event_field_concept_id.
  Observation.component:
    key: [code]
    bindings:
      Observation.component.valueQuantity.comparator: default
    exclude:
      Observation.component.dataAbsentReason: >
        the row-level dataabsentreason carries the signal
      Observation.component.interpretation: >
        the row-level interpretation is the one labs populate
      Observation.component.valueString: >
        limited analytical utility; free text inside a variant
      Observation.component.valueBoolean: not in scope of typical source data
      Observation.component.valueInteger: >
        not in scope of typical source data; integer results arrive as
        valueQuantity
      Observation.component.valueRange: not in scope of typical source data
      Observation.component.valueRatio: not in scope of typical source data
      Observation.component.valueSampledData: >
        not in scope of typical source data; waveform data belongs in a
        signal store
      Observation.component.valueTime: not in scope of typical source data
      Observation.component.valueDateTime: not in scope of typical source data
      Observation.component.valuePeriod: not in scope of typical source data
      Observation.component.code.text: >
        rendered term; the coding carries the meaning
      Observation.component.valueCodeableConcept.text: >
        rendered term; the coding carries the meaning

  # --- Free text ----------------------------------------------------------

  # Scalar string -> note_text, promoted from note[0].text. Unstructured and
  # frequently identifying; author and timestamp are not taken.
  # OMOP: no equivalent.
  Observation.note[0].text:

# ===========================================================================
# Rejected - notable absences and why (§11)
# ===========================================================================
rejected:

  # --- Reference ranges ---------------------------------------------------
  Observation.referenceRange: >
    NOT whitelisted whole - `referenceRange.low.value` and `.high.value` are
    named instead, so the age and population qualifiers do not become a
    variant
  Observation.referenceRange.type: not in scope of typical source data
  Observation.referenceRange.appliesTo: not in scope of typical source data
  Observation.referenceRange.age: not in scope of typical source data
  Observation.referenceRange.text: limited analytical utility; free text

  # --- Other value[x] forms -----------------------------------------------
  # Only Quantity and CodeableConcept are whitelisted.
  Observation.valueString: limited analytical utility; free text
  Observation.valueBoolean: >
    not in scope of typical source data; boolean results arrive as a coded
    concept
  Observation.valueInteger: >
    not in scope of typical source data; integer results arrive as
    valueQuantity with a unit
  Observation.valueRange: not in scope of typical source data
  Observation.valueRatio: not in scope of typical source data
  Observation.valueSampledData: >
    not in scope of typical source data; waveform data belongs in a signal
    store
  Observation.valueTime: not in scope of typical source data
  Observation.valueDateTime: not in scope of typical source data
  Observation.valuePeriod: not in scope of typical source data

  # --- Timing -------------------------------------------------------------
  Observation.effectivePeriod: not in scope of typical source data
  Observation.effectiveTiming: >
    not in scope of typical source data; scheduled timing belongs to orders,
    not results
  Observation.effectiveInstant: not in scope of typical source data
  Observation.issued: >
    limited analytical utility; an operational timestamp, where analysis uses
    the effective time. DiagnosticReport.issued carries turnaround

  # --- Specimen and method ------------------------------------------------
  Observation.specimen: >
    Specimen IS modelled, but the link is not reliably populated; the
    accession identifier carries it
  Observation.device: Device not modelled; would be a dangling FK
  Observation.bodySite: >
    limited analytical utility; laterality and site need their own model
  Observation.method: not in scope of typical source data

  # --- Care team and provenance -------------------------------------------
  Observation.performer: Practitioner not modelled; would be a dangling FK
  Observation.basedOn: >
    ServiceRequest IS modelled, but the link is not reliably populated in UK
    lab feeds
  Observation.partOf: >
    limited analytical utility; nesting within a larger event is a graph, not
    a column
  Observation.focus: >
    not in scope of typical source data; needs its own subject-resolution
    rule to be safe

  # --- Result grouping ----------------------------------------------------
  Observation.hasMember: >
    limited analytical utility; a lab panel is a graph, and the structure is
    recoverable from code and effective time
  Observation.derivedFrom: >
    limited analytical utility; the provenance chain is a graph, not a column

  # --- Notes and identity -------------------------------------------------
  Observation.identifier: >
    limited analytical utility; `id` carries resource identity and
    Observation identifiers are not used to reconcile feeds

  # --- Extensions ---------------------------------------------------------
  Observation.extension:triggeredByR5: >
    limited analytical utility; the reflex-testing trigger graph is out of
    scope
  Observation.extension:bodyStructureR5: >
    BodyStructure not modelled; would be a dangling FK
