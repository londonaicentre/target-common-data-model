#
# Appointment
#
# Grain: one row per Appointment resource. Fact table. No OMOP analogue -
# OMOP models what happened rather than what was planned.
#
# Purpose: what was booked, and what became of it. One row per appointment,
# holding when it was scheduled, what kind it was, who it was with and
# whether the patient attended. `status` carries the DNA/cancellation
# distinction that access and waiting-time analysis reads.
#
# `id` (PK), `meta_source` and `meta_last_updated` are added to every table
# and are not listed below.

resource: Appointment
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-Appointment
package: fhir.r4.ukcore.stu2

include:

  # --- Status -------------------------------------------------------------

  # Scalar code. `noshow` is the DNA, distinct from `cancelled`.
  # OMOP: no equivalent.
  Appointment.status:
    bindings:
      Appointment.status: default

  # --- When ---------------------------------------------------------------

  # Scalar instants -> start, end. Scheduled start and end.
  # OMOP: no equivalent.
  Appointment.start:
  Appointment.end:

  # Scalar positiveInt -> minutesduration. Booked slot length, which is not
  # always end minus start.
  # OMOP: no equivalent.
  Appointment.minutesDuration:

  # Scalar datetime -> created. When the appointment was booked; with
  # `start` this gives the wait.
  # OMOP: no equivalent.
  Appointment.created:

  # --- What kind ----------------------------------------------------------

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> appointmenttype.
  # OMOP: no equivalent.
  Appointment.appointmentType:
    bindings:
      # Manual: `extensible` across two code systems (v2-0276 plus the UK
      # Core supplement), so it cannot be expanded offline.
      Appointment.appointmentType.coding.code: AppointmentTypeEnum
    exclude:
      Appointment.appointmentType.text: >
        rendered term; the coding carries the meaning

  # Variant: [{coding[]}] of {system, code, display, is_source} ->
  # specialty. Treatment function - the outpatient stratifier.
  # OMOP: no equivalent.
  Appointment.specialty:
    key: [coding]
    bindings:
      Appointment.specialty.coding.code: default
    exclude:
      Appointment.specialty.text: >
        rendered term; the coding carries the meaning

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> cancelationreason. Who cancelled and why - separates a
  # patient-cancelled slot from a provider-cancelled one.
  # OMOP: no equivalent.
  Appointment.cancelationReason:
    bindings:
      # Manual: the FHIR CodeSystem is marked incomplete, so it cannot be
      # expanded offline.
      Appointment.cancelationReason.coding.code: AppointmentCancellationReasonEnum
    exclude:
      Appointment.cancelationReason.text: >
        rendered term; the coding carries the meaning

  # --- Variants -----------------------------------------------------------

  # Variant: [{system, value}] -> identifier. Booking reference from the
  # source system - the e-Referral appointment id, the PAS booking number.
  # OMOP: no equivalent.
  Appointment.identifier:
    key: [system, value]
    exclude:
      Appointment.identifier.assigner: >
        Organization not modelled; `system` already namespaces the issuer
      Appointment.identifier.period: >
        identifier validity windows are not populated in practice
      Appointment.identifier.type: >
        redundant with `system`
      Appointment.identifier.use: >
        not reliably populated across source systems

  # Variant: [{actor_id, required, status, period{start, end}}] ->
  # participant. Who the appointment is with. `actor` is the only route to
  # the patient - Appointment has no `subject` - so without this the table
  # cannot be joined to a patient.
  #
  # `actor` is unconstrained across Patient/Practitioner/Location/
  # HealthcareService, so no `fk` target is declared. `participant.status`
  # is per-participant attendance, distinct from the row-level `status`.
  # OMOP: no equivalent.
  Appointment.participant:
    key: [actor_id, status]
    bindings:
      Appointment.participant.status: default
      Appointment.participant.required: default
    exclude:
      Appointment.participant.type: >
        the participant's role, bound `extensible` to a SNOMED `is-a` subset
        that needs a terminology server; `actor_id` identifies who they are

  # --- Extension slices ---------------------------------------------------

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> extension_deliverychannel. In-person, telephone or video.
  # OMOP: no equivalent.
  Appointment.extension:deliveryChannel:
    bindings:
      Appointment.extension:deliveryChannel.coding.code: default
    exclude:
      Appointment.extension:deliveryChannel.text: >
        rendered term; the coding carries the meaning

# ===========================================================================
# Rejected - notable absences and why (§11)
# ===========================================================================
rejected:

  # --- Service classification ---------------------------------------------
  Appointment.serviceCategory: >
    not in scope of typical source data; `specialty` carries the
    treatment-function axis
  Appointment.serviceType: >
    not in scope of typical source data; bound `example` to an incomplete
    CodeSystem

  # --- Reason -------------------------------------------------------------
  Appointment.reasonCode: >
    limited analytical utility; the indication is carried by the linked
    Condition or the referral
  Appointment.reasonReference: >
    limited analytical utility; the indication is carried by the linked
    Condition or the referral

  # --- Priority and description -------------------------------------------
  Appointment.priority: >
    limited analytical utility; an unsignedInt with no agreed scale, so
    uninterpretable across feeds
  Appointment.description: limited analytical utility; free text
  Appointment.comment: limited analytical utility; free text
  Appointment.patientInstruction: limited analytical utility; free text

  # --- Scheduling ---------------------------------------------------------
  Appointment.slot: Slot not modelled; would be a dangling FK
  Appointment.requestedPeriod: >
    not in scope of typical source data; a booking-negotiation artefact

  # --- References to other resources --------------------------------------
  Appointment.basedOn: >
    ServiceRequest IS modelled, but the field is 0..* and would become a
    variant holding a single id in practice
  Appointment.supportingInformation: >
    unconstrained pointer across resource types; no FK target is correct

  # --- Extension slices ---------------------------------------------------
  Appointment.extension:bookingOrganization: >
    Organization IS modelled, but this is the booking organisation rather
    than the one delivering care, and it is sparsely populated
