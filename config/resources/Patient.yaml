#
# Patient
#
# Grain: one row per Patient resource. Dimension table, OMOP `person`
# analogue.
#
# Purpose: who the patient is. One row per person, holding the identifiers
# other tables join on, their name, core demographics and where they live.
# The record is canonical across contributing systems.
#
# `id` (PK), `meta_source` and `meta_last_updated` are added to every table
# and are not listed below.

resource: Patient
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-Patient
package: fhir.r4.ukcore.stu2

include:

  # --- Identity -----------------------------------------------------------

  # Scalar string -> identifier_nhsnumber_value. NHS number promoted out of
  # the identifier slice.
  Patient.identifier:nhsNumber.value:

  # Variant: [{system, value}].
  # E.g. NHS number plus MRN per contributing system.
  Patient.identifier:
    key: [system, value]
    exclude:
      Patient.identifier.assigner: >
        Organization not modelled; `system` already namespaces the issuer
      Patient.identifier.period: >
        identifier validity windows are not populated in practice
      Patient.identifier.type: >
        redundant with `system`, which already distinguishes an NHS number
        from a local MRN
      Patient.identifier.use: >
        not reliably populated across source systems

  # --- Name ---------------------------------------------------------------
  # Scalar strings -> name_family, name_given. Current name, from name[0].
  Patient.name.family:
  Patient.name.given[0]:

  # Variant: [{use, family, given[]}].
  # use distinguishes different names (e.g. maiden)
  Patient.name:
    key: [use, family]
    bindings:
      Patient.name.use: default
    exclude:
      Patient.name.prefix: >
        title (Dr, Mrs); not analytical
      Patient.name.suffix: >
        post-nominals; not analytical
      Patient.name.text: >
        rendered full name; not needed
      Patient.name.period: >
        name validity windows are not reliably populated

  # --- Demographics -------------------------------------------------------

  # OMOP: person.gender_concept_id / gender_source_value.
  Patient.gender:
    bindings:
      Patient.gender: default

  # date.
  # OMOP: person.birth_datetime
  Patient.birthDate:

  # boolean, datetime. Both forms of deceased[x] are kept.
  # OMOP: death.death_date
  Patient.deceasedBoolean:
  Patient.deceasedDateTime:

  # --- Geography ----------------------------------------------------------

  # Scalar string -> address_postalcode. Postcode of the current address,
  # from address[0].
  # OMOP: location.zip, reached via person.location_id.
  Patient.address.postalCode:

  # --- Extension slices ---------------------------------------------------

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> extension_ethniccategory.
  # OMOP: person.ethnicity_concept_id / ethnicity_source_value.
  Patient.extension:ethnicCategory:
    bindings:
      # Manual: England codeset; FHIR binds the UK-wide union.
      Patient.extension:ethnicCategory.coding.code: EthnicCategoryEnum
    exclude:
      Patient.extension:ethnicCategory.text: >
        rendered term; the coding carries the meaning

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> extension_deathnotificationstatus_extension_deathnotificationstatus.
  # OMOP: nearest is death.death_type_concept_id
  Patient.extension:deathNotificationStatus.extension:deathNotificationStatus:
    bindings:
      Patient.extension:deathNotificationStatus.extension:deathNotificationStatus.coding.code: default
    exclude:
      Patient.extension:deathNotificationStatus.extension:deathNotificationStatus.text: >
        rendered term; the coding carries the meaning

# ===========================================================================
# Rejected - notable absences and why (§11)
# ===========================================================================
rejected:

  # --- Direct identifiers -------------------------------------------------
  Patient.telecom: >
    contact route - operational, and directly identifying
  Patient.contact: >
    next-of-kin block; directly identifying third-party data with no
    analytical use
  Patient.name.prefix: >
    title (Dr, Mrs); not analytical, and it invites inferring status or
    gender from a courtesy title
  Patient.name.suffix: post-nominals; not analytical

  # --- Address ------------------------------------------------------------
  Patient.address: >
    NOT whitelisted whole - only `address.postalCode` is named, so address
    history and the identifying lines are unreachable. Revisit only if a use
    case needs address as at a point in time
  Patient.address.line: >
    directly identifying; postcode alone carries the deprivation signal
  Patient.address.city: superseded by postcode-based geography lookup
  Patient.address.district: superseded by postcode-based geography lookup
  Patient.address.country: effectively constant in a UK provider dataset
  Patient.address.extension:addressKey: >
    PAF/UPRN key - identifying, and redundant once postcode is kept

  # --- Organisations ------------------------------------------------------
  Patient.generalPractitioner: >
    GP registration is a period, not a patient attribute; it lives on the
    EpisodeOfCare table
  Patient.managingOrganization: >
    the patient record is canonical across contributing systems, so a single
    owning organisation is not meaningful

  # --- Demographics -------------------------------------------------------
  Patient.maritalStatus: >
    not in scope of typical source data; OMOP carries it as an observation
    row rather than a person attribute

  # --- Multiple birth -----------------------------------------------------
  Patient.multipleBirthBoolean: >
    twin/triplet status is neonatal-specific and not used in current cohort
    definitions; revisit with a neonatal use case
  Patient.multipleBirthInteger: as above

  # --- Administrative -----------------------------------------------------
  Patient.active: >
    record-status flag about the row rather than the person; a deactivated
    record still describes a real patient and filtering on it silently drops
    cohort members

  # --- Backbone elements --------------------------------------------------
  Patient.communication: >
    language and interpreter need are service-planning data
  Patient.link: >
    record-merge graph; belongs to the linkage layer, not the analytical
    model

  # --- Extension slices ---------------------------------------------------
  Patient.extension:birthSex: >
    overlaps `gender`; a second sex field invites two cohorts that disagree.
    Revisit if a use case needs sex-at-birth distinctly from gender, which
    is a real clinical need but needs deciding once, globally
  Patient.extension:birthPlace: >
    identifying, and country of birth is not used in current cohorts
  Patient.extension:cadavericDonor: transplant-specific
  Patient.extension:contactPreference: operational contact routing
  Patient.extension:residentialStatus: care-funding/eligibility data
  Patient.extension:patientInterpreterRequired: service-planning data
  Patient.extension:nhsNumberUnavailableReason: >
    data-quality flag about the source feed, not about the patient
  Patient.extension:deathNotificationStatus.extension:systemEffectiveDate: >
    when the notification reached the spine; an artefact of the feed rather
    than of the death. `deceaseddatetime` is the clinical date
  Patient.identifier:nhsNumber.extension:nhsNumberVerificationStatus: >
    trace/verification status is a data-quality flag about the feed; revisit
    if a use case needs to filter on unverified NHS numbers
