# Condition
#
# Grain: one row per Condition resource. Fact table, OMOP
# `condition_occurrence` analogue.
#
# Purpose: what a patient has been diagnosed with. One row per recorded
# diagnosis or problem, holding the code, when it started and stopped, and
# how far it can be trusted.
#
# `id` (PK), `meta_source` and `meta_last_updated` are added to every table
# and are not listed below.

resource: Condition
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-Condition
package: fhir.r4.ukcore.stu2

include:

  # --- Who and when -------------------------------------------------------

  # Scalar string FK id -> subject_id.
  # OMOP: condition_occurrence.person_id.
  Condition.subject:
    fk: Patient                 # profile allows [Patient, Group]
  # Scalar string FK id -> encounter_id.
  # OMOP: condition_occurrence.visit_occurrence_id.
  Condition.encounter:
    fk: Encounter

  # Scalar datetimes -> onsetdatetime, abatementdatetime. Only the dateTime
  # forms of the choice types are taken.
  # OMOP: condition_occurrence.condition_start_datetime.
  Condition.onsetDateTime:
  # OMOP: condition_occurrence.condition_end_datetime.
  Condition.abatementDateTime:

  # Scalar datetime -> recordeddate. When the condition was entered, as
  # distinct from when it began.
  # OMOP: no equivalent - no record date distinct from onset.
  Condition.recordedDate:

  # --- Status -------------------------------------------------------------
  # Together these decide whether a coded condition counts towards a cohort:
  # an entered-in-error or refuted row is not a diagnosis.

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> clinicalstatus.
  # OMOP: no equivalent.
  Condition.clinicalStatus:
    bindings:
      Condition.clinicalStatus.coding.code: default
    exclude:
      Condition.clinicalStatus.text: >
        rendered term; the coding carries the meaning

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> verificationstatus.
  # OMOP: condition_occurrence.condition_status_concept_id.
  Condition.verificationStatus:
    bindings:
      Condition.verificationStatus.coding.code: default
    exclude:
      Condition.verificationStatus.text: >
        rendered term; the coding carries the meaning

  # --- Category -----------------------------------------------------------

  # Nested Coding from category[0].coding[0]: {system, code, display,
  # is_source} -> category_coding. Problem-list entry vs encounter diagnosis.
  # OMOP: condition_occurrence.condition_type_concept_id (record provenance).
  Condition.category.coding[0]:
    bindings:
      # Manual: unions UK Core and FHIR core, so it spans two code systems.
      Condition.category.coding.code: ConditionCategoryEnum

  # --- The code that identifies the row -----------------------------------

  # Variant: [{system, code, display, is_source}] -> code_coding. Source
  # SNOMED coding plus standard-vocabulary codings added downstream;
  # `is_source` true on the original.
  #
  # Unbound: UK Core binds `preferred` to a SNOMED `is-a` subset, which needs
  # a terminology server. The vocabulary lives in the mapping layer.
  #
  # OMOP: subsumes condition_occurrence.condition_concept_id /
  # condition_source_value / condition_source_concept_id - the variant holds
  # every mapped vocabulary as rows, not just one standard concept.
  Condition.code.coding:
    key: [system, code]

  # --- Free text ----------------------------------------------------------

  # Scalar string -> note_text, promoted from note[0].text. Unstructured and
  # frequently identifying; author and timestamp are not taken.
  # OMOP: no equivalent.
  Condition.note[0].text:

# ===========================================================================
# Rejected - notable absences and why (§11)
# ===========================================================================
rejected:

  # --- Severity and site --------------------------------------------------
  Condition.severity: not in scope of typical source data
  Condition.bodySite: >
    limited analytical utility; laterality and site need their own model, and
    a first-entry scalar would mislead on a bilateral condition

  # --- Backbone elements --------------------------------------------------
  Condition.stage: not in scope of typical source data
  Condition.evidence: >
    limited analytical utility; the provenance chain is a graph problem, not
    a column

  # --- References to unmodelled resources ---------------------------------
  Condition.recorder: Practitioner not modelled; would be a dangling FK
  Condition.asserter: Practitioner not modelled; would be a dangling FK

  # --- Identity -----------------------------------------------------------
  Condition.identifier: >
    limited analytical utility; `id` carries resource identity and Condition
    identifiers are not used to reconcile feeds

  # --- onset[x] / abatement[x] --------------------------------------------
  # Only the dateTime forms are whitelisted.
  Condition.onsetAge: not in scope of typical source data
  Condition.onsetPeriod: not in scope of typical source data
  Condition.onsetRange: not in scope of typical source data
  Condition.onsetString: limited analytical utility; free text
  Condition.abatementAge: not in scope of typical source data
  Condition.abatementPeriod: not in scope of typical source data
  Condition.abatementRange: not in scope of typical source data
  Condition.abatementString: limited analytical utility; free text

  # --- Other --------------------------------------------------------------
  Condition.code: >
    NOT whitelisted whole - `code.coding` is named instead, so the variant is
    the codings themselves rather than a {coding[], text} wrapper
  Condition.code.text: >
    limited analytical utility; the coding variant carries the meaning
  Condition.category: >
    NOT whitelisted whole - `category.coding[0]` is named instead, so a
    second category is dropped rather than becoming a variant
  Condition.extension:conditionEpisode: >
    not in scope of typical source data; belongs with episode-of-care, which
    is not modelled
