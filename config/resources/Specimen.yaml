# Specimen
#
# Grain: one row per Specimen resource. Dimension table, OMOP `specimen`
# analogue.
#
# Purpose: what sample was taken from a patient. One row per specimen,
# holding what it was, when it was collected and received, and from where on
# the body. This is what makes a microbiology result interpretable.
#
# `id` (PK), `meta_source` and `meta_last_updated` are added to every table
# and are not listed below.

resource: Specimen
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-Specimen
package: fhir.r4.ukcore.stu2

include:

  # --- Status -------------------------------------------------------------

  # Scalar code.
  # OMOP: no equivalent.
  Specimen.status:
    bindings:
      Specimen.status: default

  # --- What was collected -------------------------------------------------

  # Variant: [{system, code, display, is_source}] -> type_coding. Blood
  # culture, urine, wound swab, CSF. Source coding plus standard-vocabulary
  # codings added downstream; `is_source` true on the original.
  #
  # Unbound: `preferred` to a SNOMED `=` filter subset, which needs a
  # terminology server. The vocabulary lives in the mapping layer.
  #
  # OMOP: subsumes specimen.specimen_concept_id / specimen_source_value -
  # the variant holds every mapped vocabulary as rows. Note
  # specimen_type_concept_id is record provenance, not the kind of specimen.
  Specimen.type.coding:
    key: [system, code]

  # --- Who and when -------------------------------------------------------

  # Scalar string FK id -> subject_id.
  # OMOP: specimen.person_id.
  Specimen.subject:
    fk: Patient                 # profile allows [Patient, Group, Device,
                                # Substance, Location]

  # Scalar datetime -> collection_collecteddatetime. When the specimen was
  # collected.
  # OMOP: specimen.specimen_datetime.
  Specimen.collection.collectedDateTime:

  # Nested Period: {start, end} -> collection_collectedperiod. Collection
  # window for a timed collection; both forms of collected[x] are kept.
  # OMOP: specimen.specimen_datetime; OMOP has no end.
  Specimen.collection.collectedPeriod:

  # Scalar datetime -> receivedtime. When the lab received it; with
  # collectedDateTime this gives the transport delay.
  # OMOP: no equivalent.
  Specimen.receivedTime:

  # --- Where from ---------------------------------------------------------

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> collection_bodysite. Body site the specimen came from; 0..1, so not a
  # variant.
  #
  # Unbound: `preferred` to a SNOMED `=` filter subset, which needs a
  # terminology server.
  #
  # OMOP: specimen.anatomic_site_concept_id / anatomic_site_source_value.
  Specimen.collection.bodySite:
    exclude:
      Specimen.collection.bodySite.text: >
        rendered term; the coding carries the meaning

  # --- Variants -----------------------------------------------------------

  # Variant: [{system, value}] -> identifier. Specimen number from the
  # source system.
  # OMOP: specimen.specimen_source_id.
  Specimen.identifier:
    key: [system, value]
    exclude:
      Specimen.identifier.assigner: >
        Organization not modelled; `system` already namespaces the issuer
      Specimen.identifier.period: >
        identifier validity windows are not populated in practice
      Specimen.identifier.type: >
        redundant with `system`
      Specimen.identifier.use: >
        not reliably populated across source systems

  # Scalar string -> accessionidentifier_value, promoted from the Identifier
  # struct. The lab accession number - the join from a specimen to its
  # results.
  # OMOP: specimen.specimen_source_value.
  Specimen.accessionIdentifier.value:

  # --- Extension slices ---------------------------------------------------

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> extension_samplecategory. Patient sample vs control.
  # OMOP: no equivalent; UK Core specific.
  Specimen.extension:sampleCategory:
    bindings:
      Specimen.extension:sampleCategory.coding.code: default
    exclude:
      Specimen.extension:sampleCategory.text: >
        rendered term; the coding carries the meaning

  # --- Free text ----------------------------------------------------------

  # Scalar string -> note_text, promoted from note[0].text. Unstructured and
  # frequently identifying; author and timestamp are not taken.
  # OMOP: no equivalent.
  Specimen.note[0].text:

# ===========================================================================
# Rejected - notable absences and why (§11)
# ===========================================================================
rejected:

  # --- Collection detail --------------------------------------------------
  Specimen.collection.method: not in scope of typical source data
  Specimen.collection.quantity: not in scope of typical source data
  Specimen.collection.duration: >
    not in scope of typical source data; `collectedperiod` bounds a timed
    collection
  Specimen.collection.collector: Practitioner not modelled; would be a dangling FK
  Specimen.collection.fastingStatusCodeableConcept: >
    not in scope of typical source data
  Specimen.collection.fastingStatusDuration: not in scope of typical source data

  # --- Processing and containers ------------------------------------------
  Specimen.processing: >
    limited analytical utility; laboratory workflow rather than clinical fact
  Specimen.container: limited analytical utility; a lab QC concern
  Specimen.condition: >
    not in scope of typical source data; `extensible` across two code systems
    (UKCore-BiopsyState and v2-0493) so `default` cannot resolve it

  # --- References to other resources --------------------------------------
  Specimen.request: >
    ServiceRequest IS modelled, but the field is 0..* and would become a
    variant of bare ids; the accession identifier carries the link
  Specimen.parent: >
    limited analytical utility; the aliquot chain is a graph, not a column

  # --- Identity -----------------------------------------------------------
  Specimen.accessionIdentifier: >
    NOT whitelisted whole - only `accessionIdentifier.value` is named, so the
    accession promotes to a scalar join key rather than an object. The
    `system` is effectively constant within a lab feed
