# ServiceRequest
#
# Grain: one row per ServiceRequest resource. Fact table. No OMOP analogue -
# OMOP models what happened rather than what was asked for.
#
# Purpose: what was asked for. One row per referral or order, holding what
# was requested, for whom, when and how urgently. `intent` separates a
# referral into a service from an order for a test.
#
# `id` (PK), `meta_source` and `meta_last_updated` are added to every table
# and are not listed below.

resource: ServiceRequest
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-ServiceRequest
package: fhir.r4.ukcore.stu2

include:

  # --- Status and intent --------------------------------------------------

  # Scalar code.
  # OMOP: no equivalent.
  ServiceRequest.status:
    bindings:
      ServiceRequest.status: default

  # Scalar code. Separates a suggestion from an actual referral or order.
  # OMOP: no equivalent.
  ServiceRequest.intent:
    bindings:
      ServiceRequest.intent: default

  # Scalar code.
  # OMOP: no equivalent.
  ServiceRequest.priority:
    bindings:
      ServiceRequest.priority: default

  # Scalar boolean -> donotperform. An explicit instruction NOT to perform;
  # a modifier, so ignoring it inverts the meaning of the row.
  # OMOP: no equivalent.
  ServiceRequest.doNotPerform:

  # --- What was requested -------------------------------------------------

  # Variant: [{system, code, display, is_source}] -> code_coding. Source
  # SNOMED coding plus standard-vocabulary codings added downstream;
  # `is_source` true on the original.
  #
  # Unbound: `preferred` to a SNOMED `=` filter subset, which needs a
  # terminology server. The vocabulary lives in the mapping layer.
  # OMOP: no equivalent.
  ServiceRequest.code.coding:
    key: [system, code]

  # --- Who and when -------------------------------------------------------

  # Scalar string FK id -> subject_id.
  # OMOP: no equivalent.
  ServiceRequest.subject:
    fk: Patient                 # profile allows [Patient, Group, Location,
                                # Device]
  # Scalar string FK id -> encounter_id.
  ServiceRequest.encounter:
    fk: Encounter

  # Scalar datetime -> authoredon. When the request was made - the RTT clock
  # start on a referral.
  # OMOP: no equivalent.
  ServiceRequest.authoredOn:

  # Scalar datetime -> occurrencedatetime. When the requested service should
  # occur.
  # OMOP: no equivalent.
  ServiceRequest.occurrenceDateTime:

  # Nested Period: {start, end} -> occurrenceperiod. The window the
  # requested service should fall in; both forms of occurrence[x] are kept.
  # OMOP: no equivalent.
  ServiceRequest.occurrencePeriod:

  # --- Variants -----------------------------------------------------------

  # Variant: [{system, value}] -> identifier. Referral or order number from
  # the source system.
  # OMOP: no equivalent.
  ServiceRequest.identifier:
    key: [system, value]
    exclude:
      ServiceRequest.identifier.assigner: >
        Organization not modelled; `system` already namespaces the issuer
      ServiceRequest.identifier.period: >
        identifier validity windows are not populated in practice
      ServiceRequest.identifier.type: >
        redundant with `system`
      ServiceRequest.identifier.use: >
        not reliably populated across source systems

  # --- Extension slices ---------------------------------------------------

  # Nested CodeableConcept: {coding[]} of {system, code, display, is_source}
  # -> extension_sourceofservicerequest. Where the referral came from - GP,
  # self-referral, consultant-to-consultant.
  #
  # Unbound: 57 SNOMED concepts bound `preferred`, which `default` cannot
  # reach. The vocabulary lives in the mapping layer.
  # OMOP: no equivalent.
  ServiceRequest.extension:sourceOfServiceRequest:
    exclude:
      ServiceRequest.extension:sourceOfServiceRequest.text: >
        rendered term; the coding carries the meaning

  # --- Free text ----------------------------------------------------------

  # Scalar string -> note_text, promoted from note[0].text. Unstructured and
  # frequently identifying; author and timestamp are not taken.
  # OMOP: no equivalent.
  ServiceRequest.note[0].text:

# ===========================================================================
# Rejected - notable absences and why (§11)
# ===========================================================================
rejected:

  # --- Classification -----------------------------------------------------
  ServiceRequest.category: >
    not in scope of typical source data; the requested `code` carries what
    was asked for
  ServiceRequest.category:genomicsWholeCaseSequencing: >
    not in scope of typical source data; a genomics-specific slice
  ServiceRequest.orderDetail: >
    limited analytical utility; supplementary instructions rather than what
    was ordered

  # --- Quantity -----------------------------------------------------------
  ServiceRequest.quantityQuantity: not in scope of typical source data
  ServiceRequest.quantityRatio: not in scope of typical source data
  ServiceRequest.quantityRange: not in scope of typical source data

  # --- Timing -------------------------------------------------------------
  ServiceRequest.occurrenceTiming: >
    not in scope of typical source data; Timing is a deep recursive structure
    (repeat.bounds[x], when, offset)

  # --- As-needed ----------------------------------------------------------
  ServiceRequest.asNeededBoolean: not in scope of typical source data
  ServiceRequest.asNeededCodeableConcept: not in scope of typical source data

  # --- Care team ----------------------------------------------------------
  ServiceRequest.requester: Practitioner not modelled; would be a dangling FK
  ServiceRequest.performer: >
    Practitioner not modelled, and the reference is unconstrained across
    resource types so no single FK target is correct
  ServiceRequest.performerType: not in scope of typical source data

  # --- Location -----------------------------------------------------------
  ServiceRequest.locationReference: >
    Location IS modelled, but this is the requested location rather than
    where the service happened, and it is sparsely populated
  ServiceRequest.locationCode: not in scope of typical source data

  # --- Body site and specimen ---------------------------------------------
  ServiceRequest.bodySite: >
    limited analytical utility; laterality and site need their own model
  ServiceRequest.specimen: >
    Specimen IS modelled, but the link runs the other way in practice:
    Specimen.request points here, and that is the direction feeds populate

  # --- References to other resources --------------------------------------
  ServiceRequest.basedOn: >
    limited analytical utility; the request chain is a graph, not a column
  ServiceRequest.replaces: >
    limited analytical utility; a self-referencing chain, reconstructable
    from authoredOn and the code
  ServiceRequest.requisition: not in scope of typical source data
  ServiceRequest.reasonCode: >
    limited analytical utility; the indication is carried by the linked
    Condition
  ServiceRequest.reasonReference: >
    limited analytical utility; the indication is carried by the linked
    Condition
  ServiceRequest.supportingInfo: >
    unconstrained pointer across resource types; no FK target is correct
  ServiceRequest.insurance: billing/finance, out of scope for a clinical CDM
  ServiceRequest.relevantHistory: Provenance not modelled; would be a dangling FK

  # --- Notes and protocol -------------------------------------------------
  ServiceRequest.patientInstruction: limited analytical utility; free text
  ServiceRequest.instantiatesCanonical: >
    PlanDefinition not modelled; protocol conformance is out of scope
  ServiceRequest.instantiatesUri: as above, by URI

  # --- Extension slices ---------------------------------------------------
  ServiceRequest.extension:additionalContact: >
    limited analytical utility; operational contact route, and identifying
  ServiceRequest.extension:coverage: >
    billing/finance, out of scope for a clinical CDM
