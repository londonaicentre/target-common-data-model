  DiagnosticServiceSectionEnum:
    description: 'Diagnostic service section - the axis separating a microbiology culture from a chemistry
      panel from a radiology report. A CDM-chosen SUBSET of HL7 v2-0074 (http://terminology.hl7.org/CodeSystem/v2-0074),
      which FHIR binds `example` and which `default` therefore cannot reach. Codes and displays are taken
      from that code system; this list is deliberately INCOMPLETE, covering the services seen in UK LIMS
      and RIS feeds. A report using a section outside this list fails its accepted_values test rather
      than resolving - widen the list when that happens.

      The imaging modalities in v2-0074 (CT, NMR, NMS, RUS, CUS, OUS, XRC, IMG, RX) are collapsed into
      RAD. Modality is a property of the study rather than of the reporting service, and it is carried
      by DiagnosticReport.code; splitting the service axis by modality would make a plain radiology report
