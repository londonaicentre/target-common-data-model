  ImagingModalityEnum:
    description: 'DICOM acquisition modality - the primary analyst axis of an imaging study (a CT is not
      an MRI is not a plain film). FHIR binds ImagingStudy.modality and ImagingStudy.series.modality `extensible`
      to DICOM CID 29 (http://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_CID_29.html),
      which is a DICOM publication rather than a FHIR ValueSet and ships in no package, so `default` cannot
      reach it and the list has to be hand-written.

      Codes and displays are DICOM Defined Terms taken VERBATIM from the DCM ontology as it ships in hl7.fhir.r4.core
      (CodeSystem-dicom-dcim.json, http://dicom.nema.org/resources/ontology/DCM, 3156 concepts, content:
      complete). They are hand-listed rather than derived with `source: codesystem` because DCM is a mixed
      ontology - the same code system holds equipment codes (WSD workstation, PRINT server), derived-object
      codes (PR, SEG, KO) and even patient sex codes (F, M, H). Only the acquisition modalities belong
      on this column, and there is no subset mechanism on a `codesystem` entry.

      Deliberately INCOMPLETE - a study using a modality outside this list fails its accepted_values test
      rather than resolving; widen the list when that happens. Scope is UK NHS acute radiology, cardiology
      and endoscopy. Notable omissions by choice: the ophthalmology cluster (OPT, OPV, OPM, OPR, AR, KER,
      LEN, VA, FA, FS, SRF, OAM) and the legacy pre-PACS terms (CD, DD, CF, DF, VF, DS, AS, LP, CS, CP,
      BI, DG, LS) - add the relevant block if you ingest eye services or a historical archive.'
