id: https://cdm.aicentre.co.uk/encounter
name: encounter
description: >
  Profile: UKCore-Encounter (R4 4.0.1).
  Grain: One row per Encounter resource.

imports:
  - core

classes:
  Encounter:
    description: >
      Encounter dimension. One row per Encounter resource, keyed by encounter_id.
      Encounters relate via part_of_id (episode -> spell). Analogue of OMOP visit_occurrence.
    annotations:
      grain: one_row_per_resource
      grain_key: encounter_id
    slots:
      - meta_source
      - meta_tag_code
      - meta_last_updated
    attributes:
      encounter_id:
        identifier: true
        range: string
        required: true
        description: Key for the Encounter resource. One row per encounter.
        annotations:
          fhir_path: Encounter.id
          fhir_type: id

      master_person_id:
        range: Patient
        required: true
        description: Master person this encounter belongs to. Resolved from Encounter.subject.
        annotations:
          fhir_path: Encounter.subject
          fhir_type: Reference(Patient)

      part_of_id:
        range: Encounter
        required: false
        description: Parent encounter this one is part of (episode -> spell).
        annotations:
          fhir_path: Encounter.partOf
          fhir_type: Reference(Encounter)

      encounter_category:
        range: EncounterCategoryEnum
        required: true
        description: >
          CDM-defined classification — not a FHIR element. Primary analyst axis for
          slicing the encounter table (apc_spell, apc_episode, ecds_attendance, etc.).

      encounter_status:
        range: EncounterStatusEnum
        required: false
        description: Current lifecycle state of the encounter.
        annotations:
          fhir_path: Encounter.status
          fhir_type: code
          value_set: http://hl7.org/fhir/ValueSet/encounter-status|4.0.1

      encounter_class:
        range: EncounterClassEnum
        required: false
        description: v3 ActEncounterCode classification (inpatient, ambulatory, emergency, etc.).
        annotations:
          fhir_path: Encounter.class
          fhir_type: Coding
          value_set: http://terminology.hl7.org/ValueSet/v3-ActEncounterCode

      encounter_class_display:
        range: string
        required: false
        description: Human-readable label for encounter_class. Not a FHIR element.

      encounter_type:
        range: string
        required: false
        description: Encounter type — a SNOMED CT concept from UKCore-EncounterType.
        annotations:
          fhir_path: Encounter.type.coding.code
          fhir_type: code
          value_set: https://fhir.hl7.org.uk/ValueSet/UKCore-EncounterType

      encounter_type_display:
        range: string
        required: false
        description: Human-readable label for encounter_type. Not a FHIR element.

      period_start:
        range: TimestampTz
        required: false
        description: Start of the encounter (admission/arrival).
        annotations:
          fhir_path: Encounter.period.start
          fhir_type: dateTime

      period_end:
        range: TimestampTz
        required: false
        description: End of the encounter (discharge/departure).
        annotations:
          fhir_path: Encounter.period.end
          fhir_type: dateTime

      length_minutes:
        range: decimal
        required: false
        description: Duration of the encounter in minutes (Encounter.length, normalised to minutes).
        annotations:
          fhir_path: Encounter.length
          fhir_type: Duration

      admission_method:
        range: AdmissionMethodEnum
        required: false
        description: How the patient was admitted (NHS England admission method).
        annotations:
          fhir_path: Encounter.hospitalization.extension:admissionMethod
          fhir_type: CodeableConcept
          value_set: https://fhir.hl7.org.uk/CodeSystem/UKCore-AdmissionMethodEngland

      admission_method_display:
        range: string
        required: false
        description: Human-readable label for admission_method. Not a FHIR element.

      admit_source:
        range: AdmitSourceEnum
        required: false
        description: Where the patient was admitted from (NHS England source of admission).
        annotations:
          fhir_path: Encounter.hospitalization.admitSource
          fhir_type: CodeableConcept
          value_set: https://fhir.hl7.org.uk/CodeSystem/UKCore-SourceOfAdmissionEngland

      admit_source_display:
        range: string
        required: false
        description: Human-readable label for admit_source. Not a FHIR element.

      discharge_method:
        range: DischargeMethodEnum
        required: false
        description: How the patient was discharged (NHS England discharge method).
        annotations:
          fhir_path: Encounter.extension:dischargeMethod
          fhir_type: CodeableConcept
          value_set: https://fhir.hl7.org.uk/CodeSystem/UKCore-DischargeMethodEngland

      discharge_method_display:
        range: string
        required: false
        description: Human-readable label for discharge_method. Not a FHIR element.

      discharge_destination:
        range: DischargeDestinationEnum
        required: false
        description: Where the patient was discharged to (NHS England discharge destination).
        annotations:
          fhir_path: Encounter.hospitalization.dischargeDisposition
          fhir_type: CodeableConcept
          value_set: https://fhir.hl7.org.uk/CodeSystem/UKCore-DischargeDestinationEngland

      discharge_destination_display:
        range: string
        required: false
        description: Human-readable label for discharge_destination. Not a FHIR element.

      outcome_of_attendance:
        range: OutcomeOfAttendanceEnum
        required: false
        description: Outcome of an attendance (NHS England outcome of attendance).
        annotations:
          fhir_path: Encounter.extension:OutcomeOfAttendance
          fhir_type: CodeableConcept
          value_set: https://fhir.hl7.org.uk/CodeSystem/UKCore-OutcomeOfAttendanceEngland

      outcome_of_attendance_display:
        range: string
        required: false
        description: Human-readable label for outcome_of_attendance. Not a FHIR element.

      service_provider_id:
        range: string
        required: false
        description: Organisation responsible for the encounter.
        annotations:
          fhir_path: Encounter.serviceProvider
          fhir_type: Reference(Organization)

      diagnosis:
        range: EncounterDiagnosisVariant
        multivalued: true
        inlined_as_list: true
        required: false
        description: >
          CDS primary/secondary diagnosis grid (Encounter.diagnosis[]).
          Each entry carries a condition reference, role, and rank.
        annotations:
          fhir_path: Encounter.diagnosis
          fhir_type: BackboneElement[]

  # ---------------------------------------------------------------------------
  # EncounterDiagnosisVariant
  # Repeating element for Encounter.diagnosis[].
  # ---------------------------------------------------------------------------
  EncounterDiagnosisVariant:
    description: >
      One diagnosis linked to the encounter with role and rank.
      Variant for Encounter.diagnosis[].
    attributes:
      diagnosis_id:
        identifier: true
        range: string
        required: true
        description: Surrogate PK = hash(encounter_id, condition_id, rank).

      condition_id:
        range: Condition
        required: true
        description: The condition being diagnosed. Links to Condition.
        annotations:
          fhir_path: Encounter.diagnosis.condition
          fhir_type: Reference(Condition)

      use:
        range: DiagnosisRoleEnum
        required: false
        description: Role of the diagnosis for this encounter (admission, discharge, chief complaint, etc.).
        annotations:
          fhir_path: Encounter.diagnosis.use
          fhir_type: CodeableConcept
          value_set: http://hl7.org/fhir/ValueSet/diagnosis-role

      rank:
        range: integer
        required: false
        description: Ordering position of the diagnosis (1 = primary).
        annotations:
          fhir_path: Encounter.diagnosis.rank
          fhir_type: positiveInt
