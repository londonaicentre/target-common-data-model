id: https://cdm.aicentre.co.uk/condition
name: condition
description: >
  Profile: UKCore-Condition (R4 4.0.1).
  Grain: One row per Condition resource.

annotations:
  grain: one_row_per_resource
  grain_key: condition_id

imports:
  - core
  - Patient
  - Encounter

classes:
  Condition:
    description: >
      Condition fact. One row per Condition resource, keyed by condition_id.
      Links to Patient via master_person_id and to Encounter via encounter_id.
      Analogue of OMOP condition_occurrence.
    slots:
      - meta_source
      - meta_tag_code
      - meta_last_updated
    attributes:
      condition_id:
        identifier: true
        range: string
        required: true
        description: Key for the Condition resource. One row per condition.
        annotations:
          fhir_path: Condition.id
          fhir_type: id

      master_person_id:
        range: Patient
        required: true
        description: Master person this condition belongs to. Resolved from Condition.subject.
        annotations:
          fhir_path: Condition.subject
          fhir_type: Reference(Patient)

      encounter_id:
        range: Encounter
        required: false
        description: Encounter during which the condition was recorded. Links to Encounter.
        annotations:
          fhir_path: Condition.encounter
          fhir_type: Reference(Encounter)

      recorded_date:
        range: TimestampNtz
        required: false
        description: Date/time the condition was first recorded.
        annotations:
          fhir_path: Condition.recordedDate
          fhir_type: dateTime

      condition_concept:
        range: ConditionConceptVariant
        multivalued: true
        inlined_as_list: true
        required: false
        description: >
          The coded diagnosis/problem as a CodeableConcept VARIANT. Source concept
          (is_source=true) plus any mapped standard-vocabulary concepts.
        annotations:
          fhir_path: Condition.code
          fhir_type: CodeableConcept
          value_set: https://fhir.hl7.org.uk/ValueSet/UKCore-ConditionCode

      condition_category:
        range: ConditionCategoryEnum
        required: false
        description: Context in which the condition was recorded (problem list, encounter diagnosis, etc.).
        annotations:
          fhir_path: Condition.category
          fhir_type: CodeableConcept
          value_set: https://fhir.hl7.org.uk/ValueSet/UKCore-ConditionCategory

      condition_category_display:
        range: string
        required: false
        description: Human-readable label for condition_category. Not a FHIR element.

      clinical_status:
        range: ConditionClinicalStatusEnum
        required: false
        description: Clinical status of the condition on the recorded date.
        annotations:
          fhir_path: Condition.clinicalStatus
          fhir_type: CodeableConcept
          value_set: http://hl7.org/fhir/ValueSet/condition-clinical|4.0.1

      verification_status:
        range: ConditionVerificationStatusEnum
        required: false
        description: Verification status of the condition on the recorded date.
        annotations:
          fhir_path: Condition.verificationStatus
          fhir_type: CodeableConcept
          value_set: http://hl7.org/fhir/ValueSet/condition-ver-status|4.0.1

      onset_datetime:
        range: TimestampNtz
        required: false
        description: When the condition began (onset dateTime, or start of onset Period).
        annotations:
          fhir_path: Condition.onsetDateTime
          fhir_type: dateTime

      abatement_datetime:
        range: TimestampNtz
        required: false
        description: When the condition resolved/abated (abatement dateTime, or start of abatement Period).
        annotations:
          fhir_path: Condition.abatementDateTime
          fhir_type: dateTime

  # ---------------------------------------------------------------------------
  # ConditionConceptVariant
  # Repeating element for Condition.code CodeableConcept.
  # ---------------------------------------------------------------------------
  ConditionConceptVariant:
    description: >
      One coding of the diagnosis/problem (source SNOMED, or a mapped standard concept).
      Variant for Condition.code CodeableConcept.
    attributes:
      condition_concept_id:
        identifier: true
        range: string
        required: true
        description: Surrogate PK = hash(condition_id, coding_system, coding_code).

      coding_system:
        range: uri
        required: true
        description: Code system URI/OID (REQUIRED when coded).
        annotations:
          fhir_path: Condition.code.coding.system
          fhir_type: uri

      coding_code:
        range: string
        required: true
        description: The code.
        annotations:
          fhir_path: Condition.code.coding.code
          fhir_type: code
          value_set: https://fhir.hl7.org.uk/ValueSet/UKCore-ConditionCode

      coding_display:
        range: string
        required: false
        description: Human-readable display for the code.
        annotations:
          fhir_path: Condition.code.coding.display
          fhir_type: string

      is_source:
        range: boolean
        required: true
        description: >
          True on the source concept, false on mapped concepts.
          Exactly one true per array. NOT a canonical FHIR element.
