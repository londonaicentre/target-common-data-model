id: https://cdm.aicentre.co.uk/
name: flatfhir
description: >
  FlatFHIR CDM — flattened UK Core FHIR R4 analytical schemas.
  Covers Patient, Encounter, Condition, and FactObservation,
  plus inline variant classes for repeating / complex FHIR elements.
  Each main class represents one analytical table (one row per FHIR resource).

prefixes:
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  fhir: http://hl7.org/fhir/
  ukcore: https://fhir.hl7.org.uk/
  flatfhir: https://aic.example.org/flatfhir/

default_prefix: flatfhir
default_range: string

imports:
  - linkml:types
  - enums

# =============================================================================
# Custom types
# =============================================================================
types:
  TimestampNtz:
    uri: xsd:dateTime
    base: str
    description: Wall clock timestamp. Maps to FHIR dateTime / instant.

# =============================================================================
# Coding object — CONVENTIONS §5
#
# Coding and CodeableConcept are never flattened; they surface as an object of
# system / code / display. Keys are the FHIR element names — the column name
# supplies the context a `coding_` prefix used to carry.
#
# Emitted as a Snowflake VARIANT. No accepted_values is emitted on an object
# column, since an object never equals a bare code; the binding is recorded in
# meta so the test stays derivable downstream.
# =============================================================================
classes:
  CodingObject:
    description: >
      A single coding as an object of system, code and display. Used for every
      Coding- and CodeableConcept-typed column (CONVENTIONS §5).
    attributes:
      system:
        range: uri
        description: Code system the code is drawn from.
        annotations:
          fhir_type: uri
      code:
        range: string
        description: Symbol in syntax defined by the system.
        annotations:
          fhir_type: code
      display:
        range: string
        description: Representation defined by the system.
        annotations:
          fhir_type: string

# =============================================================================
# Shared provenance slots — Resource.meta fields common to all tables
# =============================================================================
slots:
  meta_source:
    # example: https://discoverydataservice.org/discovery
    #.         https://lewishamandgreenwich.nhs.uk/cerner/835
    #.         https://lewishamandgreenwich.nhs.uk/rio
    #.         https://lewishamandgreenwich.nhs.uk/epic/
    range: uri
    required: true
    description: Source system URI the record originated from.
    annotations:
      fhir_path: Resource.meta.source
      fhir_type: uri

  meta_tag_code:
    range: string
    required: false
    description: Feed/extract tag stamped by the source (meta.tag.code).
    annotations:
      fhir_path: Resource.meta.tag.code
      fhir_type: code

  meta_last_updated:
    range: TimestampNtz
    required: false
    description: When the source last changed the record.
    annotations:
      fhir_path: Resource.meta.lastUpdated
      fhir_type: instant
