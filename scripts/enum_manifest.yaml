      - { code: relapse }
      - { code: inactive }
      - { code: remission }
      - { code: resolved }

  ConditionVerificationStatusEnum:
    description: "Condition verification status (HL7 FHIR condition-ver-status, R4 4.0.1)."
    source: manual
    values:
