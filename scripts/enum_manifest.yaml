# Enum manifest for flatfhir/enums.yaml generation.
# Run:  uv run scripts/generate_enums.py
#
# Requires FHIR packages to be installed first:
#   npm install
#
# source types:
#   codesystem  – concepts extracted from a FHIR CodeSystem in node_modules/
#                 identified by canonical url + npm package name
#   manual      – values defined inline below (stable FHIR R4 / CDM-defined)

enums:

  # ---------------------------------------------------------------------------
  # Patient
  # ---------------------------------------------------------------------------

  AdministrativeGenderEnum:
    description: "Administrative gender (HL7 FHIR administrative-gender, R4 4.0.1)."
    source: manual
    values:
      - { code: male,    display: "Male" }
      - { code: female,  display: "Female" }
      - { code: other,   display: "Other" }
      - { code: unknown, display: "Unknown" }

  EthnicCategoryEnum:
    description: "NHS England ethnic category codes (UKCore-EthnicCategoryEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-EthnicCategoryEngland
    package: fhir.r4.ukcore.stu2

  MaritalStatusEnum:
    description: "NHS England person marital status codes (UKCore-PersonMaritalStatusEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-PersonMaritalStatusEngland
    package: fhir.r4.ukcore.stu2

  # ---------------------------------------------------------------------------
  # Encounter
  # ---------------------------------------------------------------------------

  EncounterCategoryEnum:
    description: "CDM-defined encounter category. Primary analyst axis; not a FHIR element."
    source: manual
    values:
      - { code: apc_spell,         display: "APC spell (admission to discharge)" }
      - { code: apc_episode,       display: "APC consultant episode (within a spell)" }
      - { code: ecds_attendance,   display: "Emergency Care Data Set attendance" }
      - { code: opd_attendance,    display: "Outpatient attendance" }
      - { code: gp_encounter,      display: "GP/primary care encounter" }
      - { code: ward_stay,         display: "Ward movement / bed-day record" }
      - { code: icu_stay,          display: "ICU/HDU stay" }

  EncounterStatusEnum:
    description: "Encounter lifecycle status (HL7 FHIR encounter-status, R4 4.0.1)."
    source: manual
    values:
      - { code: planned }
      - { code: arrived }
      - { code: triaged }
      - { code: in-progress }
      - { code: onleave }
      - { code: finished }
      - { code: cancelled }
      - { code: entered-in-error }
      - { code: unknown }

  EncounterClassEnum:
    description: "v3 ActEncounterCode — encounter class."
    source: manual
    values:
      - { code: AMB,    display: "Ambulatory" }
      - { code: EMER,   display: "Emergency" }
      - { code: FLD,    display: "Field" }
      - { code: HH,     display: "Home health" }
      - { code: IMP,    display: "Inpatient encounter" }
      - { code: ACUTE,  display: "Inpatient acute" }
      - { code: NONAC,  display: "Inpatient non-acute" }
      - { code: OBSENC, display: "Observation encounter" }
      - { code: PRENC,  display: "Pre-admission" }
      - { code: SS,     display: "Short stay" }
      - { code: VR,     display: "Virtual" }

  AdmissionMethodEnum:
    description: "NHS England admission method codes (UKCore-AdmissionMethodEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-AdmissionMethodEngland
    package: fhir.r4.ukcore.stu2

  AdmitSourceEnum:
    description: "NHS England source of admission codes (UKCore-SourceOfAdmissionEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-SourceOfAdmissionEngland
    package: fhir.r4.ukcore.stu2

  DischargeMethodEnum:
    description: "NHS England discharge method codes (UKCore-DischargeMethodEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-DischargeMethodEngland
    package: fhir.r4.ukcore.stu2

  DischargeDestinationEnum:
    description: "NHS England discharge destination codes (UKCore-DischargeDestinationEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-DischargeDestinationEngland
    package: fhir.r4.ukcore.stu2

  OutcomeOfAttendanceEnum:
    description: "NHS England outcome of attendance codes (UKCore-OutcomeOfAttendanceEngland)."
    source: codesystem
    url: https://fhir.hl7.org.uk/CodeSystem/UKCore-OutcomeOfAttendanceEngland
    package: fhir.r4.ukcore.stu2

  DiagnosisRoleEnum:
    description: "Role of the diagnosis for the encounter (HL7 diagnosis-role value set)."
    source: manual
    values:
      - { code: AD,       display: "Admission diagnosis" }
      - { code: DD,       display: "Discharge diagnosis" }
      - { code: CC,       display: "Chief complaint" }
      - { code: CM,       display: "Co-morbidity diagnosis" }
      - { code: pre-op,   display: "Pre-op diagnosis" }
      - { code: post-op,  display: "Post-op diagnosis" }
      - { code: billing,  display: "Billing" }

  # ---------------------------------------------------------------------------
  # Condition
  # ---------------------------------------------------------------------------

  ConditionCategoryEnum:
    description: "Condition category (UKCore-ConditionCategory + FHIR core condition-category)."
    source: manual
    values:
      - { code: problem-list-item,    display: "Problem list item" }
      - { code: encounter-diagnosis,  display: "Encounter diagnosis" }
      - { code: presenting-complaint, display: "Presenting complaint" }
      - { code: co-morbidity,         display: "Co-morbidity" }

  ConditionClinicalStatusEnum:
    description: "Condition clinical status (HL7 FHIR condition-clinical, R4 4.0.1)."
    source: manual
    values:
      - { code: active }
      - { code: recurrence }
      - { code: relapse }
      - { code: inactive }
      - { code: remission }
      - { code: resolved }

  ConditionVerificationStatusEnum:
    description: "Condition verification status (HL7 FHIR condition-ver-status, R4 4.0.1)."
    source: manual
    values:
      - { code: unconfirmed }
      - { code: provisional }
      - { code: differential }
      - { code: confirmed }
      - { code: refuted }
      - { code: entered-in-error }

  # ---------------------------------------------------------------------------
  # Observation
  # ---------------------------------------------------------------------------

  ObservationStatusEnum:
    description: "Observation lifecycle status (HL7 FHIR observation-status, R4 4.0.1)."
    source: manual
    values:
      - { code: registered }
      - { code: preliminary }
      - { code: final }
      - { code: amended }
      - { code: corrected }
      - { code: cancelled }
      - { code: entered-in-error }
      - { code: unknown }

  ObservationCategoryEnum:
    description: "Observation category (HL7 FHIR observation-category)."
    source: manual
    values:
      - { code: social-history, display: "Social history" }
      - { code: vital-signs,    display: "Vital signs" }
      - { code: imaging,        display: "Imaging" }
      - { code: laboratory,     display: "Laboratory" }
      - { code: procedure,      display: "Procedure" }
      - { code: survey,         display: "Survey" }
      - { code: exam,           display: "Exam" }
      - { code: therapy,        display: "Therapy" }
      - { code: activity,       display: "Activity" }

  DataAbsentReasonEnum:
    description: "Why a result value is absent (HL7 FHIR data-absent-reason)."
    source: manual
    values:
      - { code: unknown }
      - { code: asked-unknown }
      - { code: temp-unknown }
      - { code: not-asked }
      - { code: asked-declined }
      - { code: masked }
      - { code: not-applicable }
      - { code: unsupported }
      - { code: as-text }
      - { code: error }
      - { code: not-a-number }
      - { code: negative-infinity }
      - { code: positive-infinity }
      - { code: not-performed }
      - { code: not-permitted }

  ObservationInterpretationEnum:
    description: "Clinical interpretation of an observation result (HL7 FHIR observation-interpretation)."
    source: manual
    values:
      - { code: L,     display: "Low" }
      - { code: H,     display: "High" }
      - { code: LL,    display: "Critical Low" }
      - { code: HH,    display: "Critical High" }
      - { code: N,     display: "Normal" }
      - { code: A,     display: "Abnormal" }
      - { code: AA,    display: "Critical Abnormal" }
      - { code: U,     display: "Significant Change Up" }
      - { code: D,     display: "Significant Change Down" }
      - { code: B,     display: "Better" }
      - { code: W,     display: "Worse" }
      - { code: R,     display: "Resistant" }
      - { code: S,     display: "Susceptible" }
      - { code: I,     display: "Intermediate" }
      - { code: MS,    display: "Moderately Susceptible" }
      - { code: VS,    display: "Very Susceptible" }
      - { code: IE,    display: "Insufficient Evidence" }
      - { code: SYN-R, display: "Synergy - Resistant" }
      - { code: SYN-S, display: "Synergy - Susceptible" }
