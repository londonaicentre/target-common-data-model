# Encounter - deviations from the Part A defaults only.
# Everything not named here follows CONVENTIONS.md Part A.

resource: Encounter
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-Encounter
package: fhir.r4.ukcore.stu2

# CodeableConcepts that ARE the fact (Part A §7). Encounter has none - it is a
# dimension, not a fact.
fact_code: []

# Repeating elements kept as variants because the repetition carries
# information (Part B §4). `key` is required - the script never guesses the
# surrogate key (Part B §5).
variants:
  Encounter.diagnosis:
    reason: CDS primary/secondary diagnosis grid; rank is analytically meaningful
    key: [condition, rank]
  Encounter.identifier:
    reason: several identifiers per encounter across source systems; the set is the information
    key: [system, value]
  Encounter.type:
    reason: repeating in the profile and each type is a distinct classification of the same encounter
    key: [system, code]

# Dropped paths, including everything beneath them (Part B §3).
# A reason is mandatory - that is what makes this file reviewable.
exclude:
  Encounter.statusHistory: audit trail, not analytical
  Encounter.classHistory: audit trail, not analytical
  Encounter.participant: out of scope for v1
  Encounter.location: deferred - needs its own ward-stay model
  Encounter.account: billing, not in scope for a clinical CDM
  Encounter.basedOn: ServiceRequest is not modelled
  Encounter.episodeOfCare: EpisodeOfCare is not modelled
  Encounter.appointment: Appointment is not modelled
  Encounter.reasonReference: mixed targets (Condition/Procedure/Observation/ImmunizationRecommendation), no single FK
  Encounter.extension:legalStatus: mental-health legal status, out of scope for v1

# Reference paths that get a relationships test, and the resource they point at
# (Part B §6). Default empty - no test is emitted for an undeclared path.
# Only declare a target the CDM actually models.
fk:
  Encounter.subject: Patient      # profile allows [Patient, Group]
  Encounter.partOf: Encounter
  # Encounter.serviceProvider -> Organization: not modelled yet
