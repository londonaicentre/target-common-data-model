# Patient - deviations from the Part A defaults only.
#
# Patient is keyed by `id` like every other resource (Part A §3). Entity
# resolution is a property of how the table is built upstream, not of a column
# name, and is documented in the class description.

resource: Patient
profile: https://fhir.hl7.org.uk/StructureDefinition/UKCore-Patient
package: fhir.r4.ukcore.stu2

fact_code: []

variants:
  Patient.identifier:
    reason: NHS number alongside local MRNs; the set of identifiers is the information
    key: [system, value]
  Patient.name:
    reason: official and maiden names are both needed for matching and display
    key: [use, family]
  Patient.address:
    reason: home/temporary addresses carry distinct analytical meaning
    key: [use, postalCode]

exclude:
  # Complex repeats inside repeats (Part A §11). These hard-fail on first run
  # and are declared here rather than discovered.
  Patient.address.extension:addressKey: repeating named extension inside a repeating element; UPRN not used in v1
  Patient.communication.extension:proficiency.extension:type: repeating named extension nested two deep; not populated
  Patient.contact: contact.telecom is a complex repeat inside a repeat; next-of-kin is out of scope for v1

  Patient.telecom: contact details are identifiable and not analytical
  Patient.link: entity resolution happens upstream; link is not carried
  Patient.generalPractitioner: mixed targets (Organization/Practitioner/PractitionerRole), none modelled
  Patient.managingOrganization: Organization is not modelled
  Patient.extension:cadavericDonor: not populated in current feeds
  Patient.extension:contactPreference: contact detail, not analytical
  Patient.extension:patientInterpreterRequired: not populated in current feeds
  Patient.extension:nhsNumberUnavailableReason: not populated in current feeds
  Patient.extension:birthPlace: value[x] is Address; free-text birth place is not analytical

fk: {}    # Patient is the root dimension - it points at nothing the CDM models
