name: Publish dbdocs

# Publishes the ERD (docs/erd.dbml) to dbdocs.io whenever it changes on main.
# Needs a DBDOCS_TOKEN repository secret: run `npx dbdocs login` then
# `npx dbdocs token -g` locally and store the printed token.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/erd.dbml'
  workflow_dispatch:

jobs:
  dbdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate the DBML
        run: npx --yes dbdocs@1.7.0 validate docs/erd.dbml

      - name: Build and publish
        env:
          DBDOCS_TOKEN: ${{ secrets.DBDOCS_TOKEN }}
        run: npx --yes dbdocs@1.7.0 build docs/erd.dbml --project flatfhir
