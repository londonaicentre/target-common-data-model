name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linkml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v8.3.2

      - name: Install FHIR packages
        run: npm install .

      # Quick smoke test to ensure scripts run okay
      - name: Check the spec generates cleanly
        run: |
          uv run scripts/expand_fhir.py
          uv run scripts/generate_linkml.py
          uv run scripts/generate_dbt_seeds.py
          uv run scripts/generate_dbt_yaml.py

      - name: Lint the generated schemas
        run: uvx --with linkml linkml lint cdm --all --ignore-warnings

      - name: Ensure generated schemas are up to date
        run: |
          if git diff --quiet --exit-code; then
            echo "Regenerating output did not result in changes"
          else
            echo "Generated files changed on regeneration; ensure the committed versions are up to date."
            git diff --stat
            exit 1
          fi
