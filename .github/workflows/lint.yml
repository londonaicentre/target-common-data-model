name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linkml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uvx --with linkml linkml lint cdm --all --ignore-warnings

      - name: Install FHIR packages
        run: npm install .

      - name: Regenerate enums and dbt artifacts
        run: |
          uv run scripts/generate_enums.py
          uv run scripts/generate_dbt_seeds.py
          uv run scripts/generate_dbt_yaml.py

      - name: Ensure generated files are up to date
        run: |
          git add -A cdm dbt_metadata
          if git diff --cached --quiet -- cdm dbt_metadata; then
            echo "Generated files are up to date."
          else
            echo "Generated files are stale; regenerate locally and commit the result."
            git diff --cached --stat -- cdm dbt_metadata
            exit 1
          fi
