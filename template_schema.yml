version: 2

# =============================================================================
# TEMPLATE — first-class table
# =============================================================================
# This is the template for table definitions in the flattened-FHIR model
#
# Conventions:
#   - data_type   : Canonical dbt type, use Snowflake dialect (varchar, number,
#                   boolean, timestamp_tz, date, variant)
#   - constraints : Enforce not_null
#   - meta        : Documentation only, never enforced
#                   This must always contains FHIR docs:
#                    - fhir_path      : path to resource, null if not FHIR
#                    - fhir_type      : type of resource, null if not FHIR
#                    - value_set      : define binding, and codes if enumerable
#                    - variant_fields : list of fields in variant
#                    - variant_schema : local path to yaml definition of variant
#   - tests       : Validate on uniqueness and acceptable data types.
#                    - accepted_values  : used where a value set is enumerable
# =============================================================================

models:
  - name: <model_name>            # e.g. dim_<resource>, fact_<resource>
    description: >
      <Plain English description of what table represents
      and key relationshisp to rest of CDM>
    config:
      materialized: <table | view>
      contract:
        enforced: true
    columns:

      # Primary key — mandatory, unique
      - name: <primary_key>
        data_type: varchar
        description: <Plain English description of per key/row meaning>
        constraints:
          - type: not_null
        meta:
          fhir_path: <Resource.id>
          fhir_type: id
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: [unique]

      # Value-set-bounded column — constrained to a value set
      - name: <value_set_bounded_column>
        data_type: varchar
        description: <Plain-English meaning>
        constraints: null
        meta:
          fhir_path: <Path to FHIR resource>
          fhir_type: <FHIR datatype>
          value_set:
            binding: <value set URL>
            codes: [<CODE1>, <CODE2>]        # if enumerable
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [<CODE1>, <CODE2>]     # if enumerable

      # Plain scalar column — no vocabulary
      - name: <plain_column>
        data_type: <varchar | number | boolean | timestamp_tz | date>
        description: <Plain-English meaning>
        constraints: null
        meta:
          fhir_path: <Path to FHIR resource>
          fhir_type: <FHIR datatype>
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # CodeableConcept column — a coded fact stored as a VARIANT.
      # The fact may carry multiple codings (the source concept plus mapped concepts)
      - name: <concept>
        data_type: variant
        description: >
          <Plain-English meaning, description that this is held as a VARIANT>.
        constraints: null
        meta:
          fhir_path: <Path to FHIR resource>     # the CodeableConcept element
          fhir_type: CodeableConcept
          value_set: null
          variant_fields: [coding_system, coding_code, coding_display, is_source]
          variant_schema: <template_concept_variant_schema.yml>
        tests: null

      # Repeating-element column — a repeatable/backbone element as a VARIANT
      # Use for native FHIR backbone/array elements that carry several fields
      # Each variant object is itself flat (single-level)
      - name: <repeating_element>
        data_type: variant
        description: >
          <Plain-English meaning; state that this holds the native
          <Resource.element>[] backbone as a repeatable VARIANT>.
        constraints: null
        meta:
          fhir_path: <Path to FHIR resource>     # the array / backbone element
          fhir_type: <BackboneElement[] | object[]>
          value_set: null
          variant_fields: [<field_a>, <field_b>, <rank>]
          variant_schema: <template_element_variant_schema.yml>
        tests: null
