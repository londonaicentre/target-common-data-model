version: 2

# =============================================================================
# TEMPLATE — CodeableConcept variant object
# =============================================================================
# Defines the flat object held in a CodeableConcept VARIANT column
# (see template_schema.yml). One object per coding; exactly one is_source=true
# per array (the source concept), mapped concepts are is_source=false.
#
# Testing: a custom step explodes this variant array into its own view (one row
# per object). This file is the contract for that view, so `constraints` and
# `tests` are enforced. Each object needs a surrogate PK unique across all
# objects in the parent table (hash of parent PK + the coding that identifies
# the object).
# =============================================================================

variants:
  - name: <concept>_variant
    description: <What one coding in this variant represents>
    fhir_path: <Path to FHIR resource>     # the CodeableConcept element
    fhir_type: CodeableConcept
    fields:

      # Surrogate PK — unique across all objects in the parent table
      - name: <concept>_id
        data_type: varchar
        description: Surrogate PK = hash(<parent_pk>, coding_system, coding_code)
        constraints:
          - type: not_null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
        tests: [unique, not_null]

      - name: coding_system
        data_type: varchar
        description: Code system URI/OID (REQUIRED when coded)
        constraints:
          - type: not_null
        meta:
          fhir_path: <CodeableConcept>.coding.system
          fhir_type: uri
          value_set: null
        tests: null

      - name: coding_code
        data_type: varchar
        description: The code
        constraints:
          - type: not_null
        meta:
          fhir_path: <CodeableConcept>.coding.code
          fhir_type: code
          value_set:
            binding: <value set URL>
            codes: [<CODE1>, <CODE2>]        # only if reasonable to constrain
        tests:
          - accepted_values:
              values: [<CODE1>, <CODE2>]     # if enumerable

      - name: coding_display
        data_type: varchar
        description: Human-readable display
        constraints: null
        meta:
          fhir_path: <CodeableConcept>.coding.display
          fhir_type: string
          value_set: null
        tests: null

      - name: is_source
        data_type: boolean
        description: >
          True on the source concept, false on mapped concepts.
          Exactly one true per array. NOT a canonical FHIR element.
        constraints:
          - type: not_null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
        tests: null
