version: 2

# =============================================================================
# Patient.identifier[] — repeating-element variant
# =============================================================================
# One object per patient identifier OTHER than the NHS number (the NHS number
# is surfaced as scalar columns on dim_patient).
# =============================================================================

variants:
  - name: identifier_variant
    description: One non-NHS-number identifier for the patient (e.g. local/hospital number).
    fhir_path: Patient.identifier
    fhir_type: Identifier[]
    fields:

      - name: identifier_id
        data_type: varchar
        description: Surrogate PK = hash(patient_id, system, value).
        constraints:
          - type: not_null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
        tests: [unique, not_null]

      - name: system
        data_type: varchar
        description: Namespace URI for the identifier value.
        constraints:
          - type: not_null
        meta:
          fhir_path: Patient.identifier.system
          fhir_type: uri
          value_set: null
        tests: null

      - name: value
        data_type: varchar
        description: The identifier value within the system namespace.
        constraints:
          - type: not_null
        meta:
          fhir_path: Patient.identifier.value
          fhir_type: string
          value_set: null
        tests: null

      # EXCLUDED - limited purpose in analytical table
      # - name: use
      #   data_type: varchar
      #   description: Purpose of the identifier (usual, official, temp, secondary, old).
      #   constraints: null
      #   meta:
      #     fhir_path: Patient.identifier.use
      #     fhir_type: code
      #     value_set:
      #       binding: http://hl7.org/fhir/ValueSet/identifier-use|4.0.1
      #       codes: [usual, official, temp, secondary, old]
      #   tests:
      #     - accepted_values:
      #         values: [usual, official, temp, secondary, old]
