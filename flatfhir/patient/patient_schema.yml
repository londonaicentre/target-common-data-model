version: 2

# =============================================================================
# dim_patient — flattened UK Core Patient
# =============================================================================
# One row per Patient resource. Scope is analyst / OMOP `person` / NHS CDS
# core: demographics, NHS number, ethnicity, marital status, geography.
#
# Profile: UKCore-Patient (R4 4.0.1).
# =============================================================================

models:
  - name: dim_patient
    description: >
      Patient dimension. One row per Patient resource, keyed by master_person_id.
      Referenced by clinical fact tables (condition, encounter, observation, etc.).
    config:
      materialized: table
      contract:
        enforced: true
    columns:

      # Primary key
      - name: master_person_id
        data_type: varchar
        description: master id (over other linked ids) for Patient resource. One row per patient.
        constraints:
          - type: not_null
        meta:
          fhir_path: Patient.id
          fhir_type: id
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: [unique]

      # NHS number
      - name: nhs_number
        data_type: varchar
        description: NHS number (10-digit national patient identifier).
        constraints: null
        meta:
          fhir_path: Patient.identifier:nhsNumber.value
          fhir_type: string
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Status
      - name: active
        data_type: boolean
        description: Whether this patient record is in active use.
        constraints: null
        meta:
          fhir_path: Patient.active
          fhir_type: boolean
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Demographics
      - name: gender
        data_type: varchar
        description: Administrative gender used for record-keeping.
        constraints: null
        meta:
          fhir_path: Patient.gender
          fhir_type: code
          value_set:
            binding: http://hl7.org/fhir/ValueSet/administrative-gender|4.0.1
            codes: [male, female, other, unknown]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [male, female, other, unknown]

      - name: birth_date
        data_type: date
        description: Date of birth.
        constraints: null
        meta:
          fhir_path: Patient.birthDate
          fhir_type: date
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: deceased_boolean
        data_type: boolean
        description: Whether the patient is recorded as deceased.
        constraints: null
        meta:
          fhir_path: Patient.deceasedBoolean
          fhir_type: boolean
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: deceased_datetime
        data_type: timestamp_tz
        description: Date/time of death, when known.
        constraints: null
        meta:
          fhir_path: Patient.deceasedDateTime
          fhir_type: dateTime
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: ethnic_category
        data_type: varchar
        description: Ethnic category code (NHS England ethnic category).
        constraints: null
        meta:
          fhir_path: Patient.extension:ethnicCategory
          fhir_type: code
          value_set:
            binding: https://fhir.hl7.org.uk/CodeSystem/UKCore-EthnicCategoryEngland
            codes: [A, B, C, D, E, F, G, H, J, K, L, M, N, P, R, S, Z, "99"]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [A, B, C, D, E, F, G, H, J, K, L, M, N, P, R, S, Z, "99"]

      - name: ethnic_category_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for ethnic_category. Derived from the code; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: marital_status
        data_type: varchar
        description: Marital (civil) status code (NHS England person marital status).
        constraints: null
        meta:
          fhir_path: Patient.maritalStatus
          fhir_type: code
          value_set:
            binding: https://fhir.hl7.org.uk/CodeSystem/UKCore-PersonMaritalStatusEngland
            codes: [S, M, D, W, P, N, "8", "9"]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [S, M, D, W, P, N, "8", "9"]

      - name: marital_status_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for marital_status. Derived from the code; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Geography (usual/home address)
      - name: postal_code
        data_type: varchar
        description: Postcode of the patient's usual address (deprivation/geography linkage).
        constraints: null
        meta:
          fhir_path: Patient.address.postalCode
          fhir_type: string
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: city
        data_type: varchar
        description: City/town of the patient's usual address.
        constraints: null
        meta:
          fhir_path: Patient.address.city
          fhir_type: string
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: lsoa  # (not native FHIR)
        data_type: varchar
        description: Lower-layer Super Output Area. Derived from postcode downstream; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Other identifiers (NHS number excluded — held as scalars above)
      - name: identifier
        data_type: variant
        description: >
          Non-NHS-number identifiers held as a repeatable VARIANT
          (Patient.identifier[], excluding identifier:nhsNumber).
        constraints: null
        meta:
          fhir_path: Patient.identifier
          fhir_type: Identifier[]
          value_set: null
          variant_fields: [system, value]
          variant_schema: patient_identifier_variant_schema.yml
        tests: null

      # Source provenance — flattened Resource.meta
      - name: meta_source
        data_type: varchar
        description: Source system the record originated from.
        constraints: null
        meta:
          fhir_path: Patient.meta.source
          fhir_type: uri
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: meta_tag_code
        data_type: varchar
        description: Feed/extract tag stamped by the source (meta.tag.code).
        constraints: null
        meta:
          fhir_path: Patient.meta.tag.code
          fhir_type: code
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: meta_last_updated
        data_type: timestamp_tz
        description: When the source last changed the record.
        constraints: null
        meta:
          fhir_path: Patient.meta.lastUpdated
          fhir_type: instant
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # =====================================================================
      # EXCLUDED — UKCore-Patient elements not modelled (kept for traceability)
      # =====================================================================
      # nhs_number_verification_status — tested upstream during entity resolution
      # name — held in a separate PII-restricted table, not the analytical dim
      # telecom — contact points (phone/email); PII, low analytical use
      # multiple_birth — Patient.multipleBirth[x]; niche
      # birth_sex — extension:birthSex; overlaps gender, add if needed downstream
      # birth_place — extension:birthPlace; niche
      # death_notification_status — extension:deathNotificationStatus; upstream
      # residential_status — extension:residentialStatus; niche
      # contact_preference — extension:contactPreference; comms, not analytical
      # patient_interpreter_required — extension:patientInterpreterRequired; niche
      # cadaveric_donor — extension:cadavericDonor; niche
      # nhs_number_unavailable_reason — extension:nhsNumberUnavailableReason; upstream
      # general_practitioner — Patient.generalPractitioner[]; registration, model separately
      # managing_organization — Patient.managingOrganization; provenance-ish
      # contact — Patient.contact[]; next-of-kin, PII
      # communication — Patient.communication[]; language pref
      # link — Patient.link[]; patient-record linkage, handled in entity resolution
      # photo — Patient.photo[]; not analytical
      # address (full) — only postal_code/city surfaced; other address parts dropped
      # implicitRules / language / text — infrastructure / narrative