version: 2

# =============================================================================
# dim_encounter — flattened UK Core Encounter
# =============================================================================
# One row per Encounter resource. Scope is analyst / OMOP `visit_occurrence` /
# NHS CDS / ECDS, and ward movements, GP encounters. Core: the visit, its class/type,
# timing, admission/discharge (CDS) fields, and diagnosis grid.
#
# Grain note: NHS CDS spells/episodes and ward movements are each modelled as
# separate Encounter resources at different levels. The hierarchy between them
# is carried by part_of_id where possible (child -> parent, e.g. episode -> spell)
#
# Profile: UKCore-Encounter (R4 4.0.1).
# =============================================================================

models:
  - name: dim_encounter
    description: >
      Encounter dimension. One row per Encounter resource, keyed by encounter_id.
      Referenced by clinical fact tables (condition, observation, procedure, etc.).
      Encounters relate via part_of_id (episode -> spell).
    config:
      materialized: table
      contract:
        enforced: true
    columns:

      # Primary key
      - name: encounter_id
        data_type: varchar
        description: Key for the Encounter resource. One row per encounter.
        constraints:
          - type: not_null
        meta:
          fhir_path: Encounter.id
          fhir_type: id
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: [unique]

      # Subject — resolved to the CDM master person (see dim_patient)
      - name: master_person_id
        data_type: varchar
        description: Master person this encounter belongs to. Resolved from Encounter.subject.
        constraints:
          - type: not_null
        meta:
          fhir_path: Encounter.subject
          fhir_type: Reference(Patient)
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Encounter hierarchy — child (episode) points up to its parent (spell)
      - name: part_of_id
        data_type: varchar
        description: >
          Parent encounter this one is part of (mainly episode -> spell).
          The primary link for the CDS encounter hierarchy.
        constraints: null
        meta:
          fhir_path: Encounter.partOf
          fhir_type: Reference(Encounter)
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Encounter category — CDM-defined kind of encounter record (not FHIR)
      - name: encounter_category
        data_type: varchar
        description: >
          CDM-defined classification (NOT a FHIR element).
          Distinct from encounter_class (v3 act-encounter) and encounter_type (SNOMED setting).
          This is the primary axis NHS analysts would use to slice encounter table
          The value set is open and expected to grow: the codes below are the initial set.
        constraints:
          - type: not_null
        meta:
          fhir_path: null
          fhir_type: null
          value_set:
            binding: null   # CDM-defined; no FHIR/UK Core binding
            codes: [apc_spell, apc_episode, ecds_attendance, opd_attendance, gp_encounter, ward_stay, icu_stay]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [apc_spell, apc_episode, ecds_attendance, opd_attendance, gp_encounter, ward_stay, icu_stay]

      # Status
      - name: encounter_status
        data_type: varchar
        description: Current state of the encounter.
        constraints: null
        meta:
          fhir_path: Encounter.status
          fhir_type: code
          value_set:
            binding: http://hl7.org/fhir/ValueSet/encounter-status|4.0.1
            codes: [planned, arrived, triaged, in-progress, onleave, finished, cancelled, entered-in-error, unknown]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [planned, arrived, triaged, in-progress, onleave, finished, cancelled, entered-in-error, unknown]

      # Class — inpatient/outpatient/emergency etc. (v3 ActEncounterCode)
      - name: encounter_class
        data_type: varchar
        description: Classification of the encounter (inpatient, ambulatory, emergency, etc.).
        constraints: null
        meta:
          fhir_path: Encounter.class
          fhir_type: Coding
          value_set:
            binding: http://terminology.hl7.org/ValueSet/v3-ActEncounterCode
            codes: [AMB, EMER, FLD, HH, IMP, ACUTE, NONAC, OBSENC, PRENC, SS, VR]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [AMB, EMER, FLD, HH, IMP, ACUTE, NONAC, OBSENC, PRENC, SS, VR]

      - name: encounter_class_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for encounter_class. Derived from the code; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Type — specific type of encounter (SNOMED, UKCore-EncounterType).
      - name: encounter_type
        data_type: varchar
        description: >
          Encounter type code — a SNOMED CT concept from UKCore-EncounterType.
          Expected system is SNOMED CT (http://snomed.info/sct).
        constraints: null
        meta:
          fhir_path: Encounter.type.coding.code
          fhir_type: code
          value_set:
            binding: https://fhir.hl7.org.uk/ValueSet/UKCore-EncounterType
            codes: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: encounter_type_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for encounter_type. Derived from the code; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Timing
      - name: period_start
        data_type: timestamp_tz
        description: Start of the encounter (admission/arrival).
        constraints: null
        meta:
          fhir_path: Encounter.period.start
          fhir_type: dateTime
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: period_end
        data_type: timestamp_tz
        description: End of the encounter (discharge/departure).
        constraints: null
        meta:
          fhir_path: Encounter.period.end
          fhir_type: dateTime
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: length_minutes
        data_type: number
        description: Duration of the encounter in minutes (Encounter.length, normalised).
        constraints: null
        meta:
          fhir_path: Encounter.length
          fhir_type: Duration
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # NHS CDS admission fields, England bindings
      - name: admission_method
        data_type: varchar
        description: How the patient was admitted (NHS England admission method).
        constraints: null
        meta:
          fhir_path: Encounter.hospitalization.extension:admissionMethod
          fhir_type: CodeableConcept
          value_set:
            binding: https://fhir.hl7.org.uk/CodeSystem/UKCore-AdmissionMethodEngland
            codes: [
              "11", "12", "13",
              "21", "22", "23", "24", "25", "2A", "2B", "2C", "2D", "28",
              "31", "32",
              "82", "83", "81",
              "98", "99",
            ]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [
                "11", "12", "13",
                "21", "22", "23", "24", "25", "2A", "2B", "2C", "2D", "28",
                "31", "32",
                "82", "83", "81",
                "98", "99",
              ]

      - name: admission_method_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for admission_method. Derived from the code; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: admit_source
        data_type: varchar
        description: Where the patient was admitted from (NHS England source of admission).
        constraints: null
        meta:
          fhir_path: Encounter.hospitalization.admitSource
          fhir_type: CodeableConcept
          value_set:
            binding: https://fhir.hl7.org.uk/CodeSystem/UKCore-SourceOfAdmissionEngland
            codes: [
              "19", "29", "39", "49",
              "51", "52", "53", "54",
              "65", "66", "79",
              "85", "87", "88",
              "98", "99",
            ]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [
                "19", "29", "39", "49",
                "51", "52", "53", "54",
                "65", "66", "79",
                "85", "87", "88",
                "98", "99",
              ]

      - name: admit_source_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for admit_source.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # NHS CDS discharge fields (England bindings)
      - name: discharge_method
        data_type: varchar
        description: How the patient was discharged (NHS England discharge method).
        constraints: null
        meta:
          fhir_path: Encounter.extension:dischargeMethod
          fhir_type: CodeableConcept
          value_set:
            binding: https://fhir.hl7.org.uk/CodeSystem/UKCore-DischargeMethodEngland
            codes: ["1", "3", "4", "5", "6", "7", "8", "9"]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: ["1", "3", "4", "5", "6", "7", "8", "9"]

      - name: discharge_method_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for discharge_method. Derived from the code; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: discharge_destination
        data_type: varchar
        description: Where the patient was discharged to (NHS England discharge destination).
        constraints: null
        meta:
          fhir_path: Encounter.hospitalization.dischargeDisposition
          fhir_type: CodeableConcept
          value_set:
            binding: https://fhir.hl7.org.uk/CodeSystem/UKCore-DischargeDestinationEngland
            codes: [
              "19", "29", "30", "37", "38",
              "48", "49", "50", "51", "52", "53", "54",
              "65", "66", "79",
              "84", "85", "87", "88",
              "98", "99",
            ]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: [
                "19", "29", "30", "37", "38",
                "48", "49", "50", "51", "52", "53", "54",
                "65", "66", "79",
                "84", "85", "87", "88",
                "98", "99",
              ]

      - name: discharge_destination_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for discharge_destination. Derived from the code; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: outcome_of_attendance
        data_type: varchar
        description: Outcome of an attendance (NHS England outcome of attendance).
        constraints: null
        meta:
          fhir_path: Encounter.extension:OutcomeOfAttendance
          fhir_type: CodeableConcept
          value_set:
            binding: https://fhir.hl7.org.uk/CodeSystem/UKCore-OutcomeOfAttendanceEngland
            codes: ["1", "2", "3"]
          variant_fields: null
          variant_schema: null
        tests:
          - accepted_values:
              values: ["1", "2", "3"]

      - name: outcome_of_attendance_display  # (not native FHIR)
        data_type: varchar
        description: Human-readable label for outcome_of_attendance. Derived from the code; not a FHIR element.
        constraints: null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Service provider — the organisation responsible for the encounter
      - name: service_provider_id
        data_type: varchar
        description: Organisation responsible for the encounter.
        constraints: null
        meta:
          fhir_path: Encounter.serviceProvider
          fhir_type: Reference(Organization)
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # Diagnosis grid — NHS CDS primary/secondary diagnoses for this encounter
      - name: diagnosis
        data_type: variant
        description: >
          Conditions diagnosed/relevant to this encounter with role and rank,
          held as a repeatable VARIANT (Encounter.diagnosis[]). This is the CDS
          primary/secondary diagnosis grid. FK to Condition resource.
        constraints: null
        meta:
          fhir_path: Encounter.diagnosis
          fhir_type: BackboneElement[]
          value_set: null
          variant_fields: [condition_id, use, rank]
          variant_schema: encounter_diagnosis_variant_schema.yml
        tests: null

      # Source provenance — flattened Resource.meta
      - name: meta_source
        data_type: varchar
        description: Source system the record originated from.
        constraints: null
        meta:
          fhir_path: Encounter.meta.source
          fhir_type: uri
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: meta_tag_code
        data_type: varchar
        description: Feed/extract tag stamped by the source (meta.tag.code).
        constraints: null
        meta:
          fhir_path: Encounter.meta.tag.code
          fhir_type: code
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      - name: meta_last_updated
        data_type: timestamp_tz
        description: When the source last changed the record.
        constraints: null
        meta:
          fhir_path: Encounter.meta.lastUpdated
          fhir_type: instant
          value_set: null
          variant_fields: null
          variant_schema: null
        tests: null

      # =====================================================================
      # EXCLUDED — UKCore-Encounter elements not modelled (kept for traceability)
      # =====================================================================
      # location — ward movements are modelled as separate Encounters (part_of_id)
      # service_type — Encounter.serviceType; care-setting type, add if needed
      # priority — Encounter.priority; urgency, low analytical use
      # statusHistory — Encounter.statusHistory[]; status transitions, audit
      # classHistory — Encounter.classHistory[]; class transitions, audit
      # participant — Encounter.participant[]; practitioners not passed through
      # episodeOfCare — Encounter.episodeOfCare[]; looser grouping than partOf
      # basedOn — Encounter.basedOn[]; workflow request refs
      # appointment — Encounter.appointment[]; workflow refs
      # account — Encounter.account[]; billing
      # reasonCode — Encounter.reasonCode[]; the encounter reason is captured via
      #   the diagnosis grid (Encounter.diagnosis, use=AD for admission diagnosis)
      # reasonReference — Encounter.reasonReference[]; see reasonCode above
      # hospitalization.* — preAdmissionIdentifier / origin / destination /
      #   reAdmission / dietPreference / specialCourtesy / specialArrangement; niche
      # legalStatus — extension:legalStatus; mental-health legal status, specialist
      # emergencyCareDischargeStatus — extension; ECDS-specific, specialist
      # identifier — Encounter.identifier[]; business ids handled upstream
      # implicitRules / language / text — infrastructure / narrative


      # =====================================================================
      # CDS ENGLAND CODE LOOKUP — reference for the *_display columns above.
      # =====================================================================
      # Displays are the UK Core England code-system meanings (verbatim, long
      # texts abbreviated). Each *_display column carries the label for its code.
      #
      # admission_method — CodeSystem/UKCore-AdmissionMethodEngland
      #   11 = Elective Admission: Waiting list
      #   12 = Elective Admission: Booked
      #   13 = Elective Admission: Planned
      #   21 = Emergency Admission: Emergency Care / dental casualty dept of the provider
      #   22 = Emergency Admission: GP direct request for immediate admission
      #   23 = Emergency Admission: Bed bureau
      #   24 = Emergency Admission: Consultant Clinic, of this or another provider
      #   25 = Emergency Admission: via Mental Health Crisis Resolution Team
      #   2A = Emergency Admission: Emergency Care Dept of another provider (not admitted there)
      #   2B = Emergency Admission: Transfer of admitted Patient from another provider in emergency
      #   2C = Emergency Admission: Baby born at home as intended
      #   2D = Emergency Admission: Other emergency admission
      #   28 = Emergency Admission: Other means
      #   31 = Maternity Admission: Admitted ante partum
      #   32 = Maternity Admission: Admitted post partum
      #   82 = Other Admission: Birth of a baby in this provider
      #   83 = Other Admission: Baby born outside the provider (except born at home as intended)
      #   81 = Other Admission: Transfer of admitted Patient from other provider, non-emergency
      #   98 = Not applicable
      #   99 = Admission Method not known
      #
      # admit_source — CodeSystem/UKCore-SourceOfAdmissionEngland
      #   19 = Usual place of residence (incl. no fixed abode)
      #   29 = Temporary place of residence when usually resident elsewhere
      #   39 = Penal establishment, Court, or Police Station / Custody Suite
      #   49 = NHS other Hospital Provider - high security psychiatric accommodation
      #   51 = NHS other Hospital Provider - Ward for general patients / younger physically disabled / ECD
      #   52 = NHS other Hospital Provider - Ward for maternity patients or Neonates
      #   53 = NHS other Hospital Provider - Ward for mentally ill / Learning Disabilities
      #   54 = NHS run Care Home
      #   65 = Local Authority residential accommodation (care provided)
      #   66 = Local Authority foster care
      #   79 = Babies born in or on the way to hospital
      #   85 = Non-NHS (other than Local Authority) run Care Home
      #   87 = Non NHS run hospital
      #   88 = Non-NHS (other than Local Authority) run Hospice
      #   98 = Not applicable
      #   99 = Source of admission not known
      #
      # discharge_method — CodeSystem/UKCore-DischargeMethodEngland
      #   1 = Patient discharged on clinical advice or with clinical consent
      #   3 = Patient discharged by mental health review tribunal, Home Secretary or Court
      #   4 = Patient died
      #   5 = Stillbirth
      #   6 = Patient discharged him/herself
      #   7 = Patient discharged by a relative or advocate
      #   8 = Not applicable (spell not finished / episode unfinished)
      #   9 = Method of discharge not known
      #
      # discharge_destination — CodeSystem/UKCore-DischargeDestinationEngland
      #   19 = Usual place of residence (incl. no fixed abode)
      #   29 = Temporary place of residence when usually resident elsewhere
      #   30 = Repatriation from high security psychiatric accommodation in an NHS provider
      #   37 = Court
      #   38 = Penal establishment or police station
      #   48 = High Security Psychiatric Hospital, Scotland
      #   49 = NHS other Hospital Provider - high security psychiatric accommodation
      #   50 = NHS other Hospital Provider - medium secure unit
      #   51 = NHS other Hospital Provider - Ward for general patients / younger physically disabled
      #   52 = NHS other Hospital Provider - Ward for maternity patients or Neonates
      #   53 = NHS other Hospital Provider - Ward for mentally ill / Learning Disabilities
      #   54 = NHS run Care Home
      #   65 = Local Authority residential accommodation (care provided)
      #   66 = Local Authority foster care
      #   79 = Not applicable - Patient died or stillbirth
      #   84 = Non-NHS run hospital - medium secure unit
      #   85 = Non-NHS (other than Local Authority) run Care Home
      #   87 = Non-NHS run hospital
      #   88 = Non-NHS (other than Local Authority) run Hospice
      #   98 = Not applicable (spell not finished / episode unfinished)
      #   99 = Not known
      #
      # outcome_of_attendance — CodeSystem/UKCore-OutcomeOfAttendanceEngland
      #   1 = Discharged from consultant's care (last attendance)
      #   2 = Another appointment given
      #   3 = Appointment to be made at a later date
      # =====================================================================
