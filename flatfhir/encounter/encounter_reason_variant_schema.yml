version: 2

# =============================================================================
# Encounter.reasonCode — CodeableConcept variant
# =============================================================================
# One object per coding of the encounter reason. Encounter.reasonCode is 0..*,
# so an encounter may carry several reasons; each carries one source concept
# (is_source=true) plus any mapped concepts (is_source=false).
# =============================================================================

variants:
  - name: reason_concept_variant
    description: One coding of the encounter reason (source, or a mapped standard concept).
    fhir_path: Encounter.reasonCode
    fhir_type: CodeableConcept
    fields:

      - name: reason_concept_id
        data_type: varchar
        description: Surrogate PK = hash(encounter_id, coding_system, coding_code).
        constraints:
          - type: not_null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
        tests: [unique, not_null]

      - name: coding_system
        data_type: varchar
        description: Code system URI/OID (REQUIRED when coded).
        constraints:
          - type: not_null
        meta:
          fhir_path: Encounter.reasonCode.coding.system
          fhir_type: uri
          value_set: null
        tests: null

      - name: coding_code
        data_type: varchar
        description: The code.
        constraints:
          - type: not_null
        meta:
          fhir_path: Encounter.reasonCode.coding.code
          fhir_type: code
          value_set:
            binding: http://hl7.org/fhir/ValueSet/encounter-reason
            codes: null
        tests: null

      - name: coding_display
        data_type: varchar
        description: Human-readable display.
        constraints: null
        meta:
          fhir_path: Encounter.reasonCode.coding.display
          fhir_type: string
          value_set: null
        tests: null

      - name: is_source
        data_type: boolean
        description: >
          True on the source concept, false on mapped concepts.
          Exactly one true per reason. NOT a canonical FHIR element.
        constraints:
          - type: not_null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
        tests: null
