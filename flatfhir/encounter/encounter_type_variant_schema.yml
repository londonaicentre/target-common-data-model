version: 2

# =============================================================================
# Encounter.type — CodeableConcept variant
# =============================================================================
# One object per coding of the encounter type. Exactly one is_source=true (the
# source concept); mapped standard-vocabulary concepts are is_source=false.
# =============================================================================

variants:
  - name: encounter_type_variant
    description: One coding of the encounter type (source, or a mapped standard concept).
    fhir_path: Encounter.type
    fhir_type: CodeableConcept
    fields:

      - name: encounter_type_id
        data_type: varchar
        description: Surrogate PK = hash(encounter_id, coding_system, coding_code).
        constraints:
          - type: not_null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
        tests: [unique, not_null]

      - name: coding_system
        data_type: varchar
        description: Code system URI/OID (REQUIRED when coded).
        constraints:
          - type: not_null
        meta:
          fhir_path: Encounter.type.coding.system
          fhir_type: uri
          value_set: null
        tests: null

      - name: coding_code
        data_type: varchar
        description: The code.
        constraints:
          - type: not_null
        meta:
          fhir_path: Encounter.type.coding.code
          fhir_type: code
          value_set:
            binding: https://fhir.hl7.org.uk/ValueSet/UKCore-EncounterType
            codes: null
        tests: null

      - name: coding_display
        data_type: varchar
        description: Human-readable display.
        constraints: null
        meta:
          fhir_path: Encounter.type.coding.display
          fhir_type: string
          value_set: null
        tests: null

      - name: is_source
        data_type: boolean
        description: >
          True on the source concept, false on mapped concepts.
          Exactly one true per array. NOT a canonical FHIR element.
        constraints:
          - type: not_null
        meta:
          fhir_path: null
          fhir_type: null
          value_set: null
        tests: null
